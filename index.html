<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>マイスターの塔2（第1章）</title>
<link rel="icon" href="img/title/emblem.webp">
<link rel="apple-touch-icon" href="img/title/icon180.png">
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+1p:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b1024;--panel:#141b38;--line:#2e3a6e;--ink:#f1ecd8;--sub:#9fa8cc;--gold:#e8c35a;--blue:#5aa8ff;--red:#ff5a5a;--green:#4fd07a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'M PLUS 1p',system-ui,sans-serif;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);background:radial-gradient(ellipse at 50% 20%,#1d2a5c 0%,#0b1024 70%)}
button{font:inherit;color:inherit;border:none;cursor:pointer;touch-action:manipulation}
.scr{display:none;min-height:100%;max-width:640px;margin:0 auto;padding:12px}
.scr.on{display:block}
h1,h2{font-family:'Dela Gothic One',sans-serif;font-weight:400}
.btn{display:block;width:100%;padding:14px;margin:8px 0;border-radius:14px;background:linear-gradient(#2c4a9a,#1c2f6a);border:1px solid #5a7ad0;font-weight:800;font-size:17px}
.btn.gold{background:linear-gradient(#d8ae46,#946e1c);border-color:#f3d77a;color:#1b1400}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--sub);font-size:15px}
.btn:disabled{opacity:.4}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px;margin:10px 0}
.note{font-size:13px;color:var(--sub);line-height:1.7}
.hd{display:flex;align-items:center;gap:8px}
.hd h2{margin:0;font-size:20px;flex:1}
.back{background:transparent;border:1px solid var(--line);border-radius:10px;padding:7px 12px;color:var(--sub);min-height:44px}
.nw{white-space:nowrap}
.tag{display:inline-block;font-size:11px;font-weight:800;border-radius:99px;padding:1px 8px;background:#2c4a9a;color:#fff}
/* タイトル */
#title{position:fixed;inset:0;max-width:none;margin:0;padding:calc(env(safe-area-inset-top) + 4vh) 16px calc(env(safe-area-inset-bottom) + 3vh);background:#050f3c url(img/title/title_bg.webp) center/cover no-repeat;display:none;flex-direction:column;align-items:center;text-align:center;z-index:5}
#title.on{display:flex}
#title .tlogo{width:min(92vw,520px);height:auto;filter:drop-shadow(0 4px 14px #000a);pointer-events:none}
#title .tsub{font-weight:800;color:#fff;text-shadow:0 2px 6px #000,0 0 12px #000a;margin-top:2px;font-size:clamp(13px,3.6vw,16px)}
#title .tbtns{margin-top:auto;width:100%;max-width:380px}
#title .tbtns .btn.ghost{background:#0b1024cc}
#title .tbtns #btnReset{margin-top:22px;font-size:13px;padding:10px;width:auto;display:inline-block;min-width:160px;min-height:44px}
#title .tver{font-size:12px;font-weight:700;color:#dfe6ff;text-shadow:0 1px 4px #000;margin-top:6px}
#title .tnote{font-size:12px;color:#ffd9a0;text-shadow:0 1px 4px #000;margin-top:4px}
/* 横向きの案内（横向きのレイアウトは作らない） */
#rotate{display:none;position:fixed;inset:0;z-index:50;background:#0b1024;color:var(--ink);flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;font-weight:800;font-size:20px;line-height:1.7}
#rotate .rph{display:block;width:34px;height:56px;border:3px solid var(--gold);border-radius:8px;margin:0 auto 14px;box-shadow:inset 0 -8px 0 -5px var(--gold)}
@media (min-aspect-ratio:1/1) and (max-height:499px){#rotate{display:flex}}
/* 主役選び */
.cgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.cgrid.one{grid-template-columns:minmax(0,min(60%,260px));justify-content:center}
.cc{background:#0e1430;border:2px solid var(--line);border-radius:16px;padding:8px;text-align:center}
.cc img{width:100%;aspect-ratio:1/1;object-fit:contain}
.cc .nm{font-weight:800}
.cc.sel{border-color:var(--gold);box-shadow:0 0 16px #e8c35a66}
/* マップ */
#mapStat,#mapStat2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;padding-bottom:4px}
#mapStat .mini,#mapStat2 .mini{min-width:0;padding:3px 6px}#mapStat .mini img,#mapStat2 .mini img{width:32px;height:32px}
.mini{flex:none;display:flex;gap:6px;align-items:center;background:#0e1430;border:1px solid var(--line);border-radius:12px;padding:4px 8px;min-width:150px}
.mini img{width:38px;height:38px;object-fit:contain}
.mini .t{font-size:12px;font-weight:800;line-height:1.3;flex:1}
.hb{height:6px;border-radius:9px;background:#060a1a;overflow:hidden;margin-top:2px}.hb i{display:block;height:100%;background:var(--green)}
.mb i{background:var(--blue)}.sb i{background:var(--gold)}
#mapWrap{position:relative;margin:10px auto}
#mapWrap svg{position:absolute;inset:0;pointer-events:none}
.node{position:absolute;width:86px;margin-left:-43px;margin-top:-30px;border-radius:14px;background:#16204a;border:2px solid #3a4a8a;padding:5px 2px;text-align:center;font-size:11px;font-weight:800;line-height:1.2}
.node .i{font-size:22px;display:block;line-height:1}
.node .i .ic{display:block;margin:0 auto 2px}
.ic{vertical-align:middle;object-fit:contain;display:inline-block}
.node.done{border-color:#6fbf6a;background:#1c3020}
.node.av{border-color:var(--gold);animation:pul 1.2s infinite}
.node.lock{opacity:.35}
.node.boss{border-color:#c04848}
.node.used{opacity:.55;filter:grayscale(.8);border-style:dashed}
#map.busy #mapWrap,#map.busy .mbar{pointer-events:none}
@keyframes pul{0%,100%{box-shadow:0 0 0 0 #e8c35a88}50%{box-shadow:0 0 0 7px #e8c35a00}}
.mbar{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.mbar .btn{font-size:13px;padding:10px 2px}
/* バトル */
/* 戦闘の背景はノッチ・ホームバーの帯まで広げる（中身は env() の分だけ内側） */
#battle{display:none;flex-direction:column;position:relative;padding:8px;background-size:cover;background-position:center top;background-color:#0b1024;
 margin-top:calc(-1 * env(safe-area-inset-top));margin-bottom:calc(-1 * env(safe-area-inset-bottom));height:calc(100% + env(safe-area-inset-top) + env(safe-area-inset-bottom));
 padding-top:calc(8px + env(safe-area-inset-top));padding-bottom:calc(8px + env(safe-area-inset-bottom))}
#cmd.wait .cb:not(.tool),#cmd.wait .sk{opacity:.45;pointer-events:none}
#cmd .cgrid2{grid-template-columns:repeat(4,1fr)}
#cmd .cb{font-size:14px;padding:10px 2px;min-height:44px}
#cmd .cb.tool{font-size:12px;background:#121a3a}
#cmd .cb.tool.on{background:#2f6a3a;border-color:var(--green)}
#cmd #bSpd.on{background:#3a5aaa;border-color:var(--gold)}
.foe.in{animation:fin .25s ease-out}
@keyframes fin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

#battle.on{display:flex}
#foes{flex:1;display:flex;align-items:center;justify-content:center;gap:4px;min-height:150px;position:relative}
.foe{display:flex;flex-direction:column;align-items:center;position:relative;transition:transform .1s}
.foe svg{width:min(28vw,130px);height:min(28vw,130px)}
.foe.boss svg{width:min(48vw,220px);height:min(48vw,220px)}
.foe .fimg{width:min(28vw,130px);height:min(28vw,130px);object-fit:contain;filter:drop-shadow(0 6px 10px #000a);-webkit-user-drag:none}
.foe.boss .fimg{width:min(62vw,260px);height:min(62vw,260px)}
.foe.tg .fimg{filter:drop-shadow(0 0 12px #e8c35a)}
.foe.hit .fimg{filter:drop-shadow(0 0 14px #ff5a5a) brightness(1.4)}
.foe .fn{font-size:12px;font-weight:800;white-space:nowrap}
.foe .st{font-size:11px;min-height:1.4em;line-height:1.4em;white-space:nowrap;max-width:min(28vw,120px);overflow:hidden;text-overflow:ellipsis}
.foe.boss .st{max-width:min(62vw,240px)}
.foe .hb{width:80px}
.foe.tg{cursor:pointer}.foe.tg svg{filter:drop-shadow(0 0 10px #e8c35a)}
.foe.dead{opacity:0;transform:scale(.6);transition:.5s}
.foe.hit{transform:translateX(6px)}
.st{font-size:10px;color:var(--gold);min-height:13px}
#log{background:#060a1aee;border:1px solid var(--line);border-radius:12px;padding:8px 10px;font-size:14px;line-height:1.6;height:calc(1.6em * 3 + 18px);box-sizing:border-box;overflow:hidden;font-weight:700;display:flex;flex-direction:column;justify-content:flex-end}
#log>div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:none}
#log>div:last-child{white-space:normal}  /* 最新の1行だけは折り返す（古い行は上へ押し出される） */
#log div:last-child{color:#fff}#log div{color:var(--sub)}
#bparty{display:grid;gap:6px;margin-top:6px}
.pm{background:#141b38;border:2px solid var(--line);border-radius:12px;padding:5px;position:relative;display:flex;gap:6px;align-items:center;min-height:58px;min-width:0;overflow:hidden}
.pm .t{min-width:0;flex:1}
/* ギアフォックスの三面図ミッション */
.cqstep{font-weight:800;color:var(--gold);font-size:14px;white-space:nowrap}
.cqmsg{display:flex;gap:8px;align-items:center;background:#141b38;border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin:8px 0;font-size:14px;line-height:1.6}
.cqmsg img{width:44px;height:44px;object-fit:cover;object-position:50% 0;border-radius:10px;background:#0b1024;flex:none}
#cqViews{display:block;width:100%;border-radius:12px}
.cqcands{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.cqcands .cand{position:relative;background:#141b38;border:2px solid var(--line);border-radius:12px;padding:4px 4px 6px;min-height:44px}
.cqcands .cand b{position:absolute;left:8px;top:4px;font-size:16px;color:var(--gold)}
.cqcands .cand canvas{display:block;width:100%;height:auto;touch-action:none;cursor:grab}
.cqrow{display:flex;gap:6px;margin-top:4px}
.cqrow button{min-height:44px;border-radius:10px;font-weight:800;border:1px solid #5a7ad0;background:linear-gradient(#2c4a9a,#1c2f6a)}
.cqrow .cqrs{width:44px;flex:none;font-size:18px}.cqrow .cqpick{flex:1;font-size:15px}.cqrow .cqpick:disabled{opacity:.45}
.cqcands .cand.ok{border-color:var(--green);background:#16351f}.cqcands .cand.ng{border-color:var(--red);background:#3a1620}
#cqFb{min-height:72px;margin-top:8px;font-size:14px;line-height:1.6;text-align:center}
#cqFb .okc{color:var(--green);font-weight:800;font-size:18px}#cqFb .ngc{color:var(--red);font-weight:800;font-size:16px}
.pm img{width:42px;height:42px;object-fit:contain}
.pm .t{flex:1;min-width:0;font-size:11px;font-weight:800;line-height:1.25}
.pm .pnm{display:flex;gap:4px;white-space:nowrap;min-width:0}
.pm .pnm>span{min-width:0;overflow:hidden;text-overflow:ellipsis}
.pm .pnm .pnmT{flex:0 1 auto}.pm .pnm .pst{flex:0 1 auto}
.pm.act{border-color:var(--gold);box-shadow:0 0 10px #e8c35a77}
.pm.ko{opacity:.4;filter:grayscale(1)}
.pm.tg{border-color:var(--green);box-shadow:0 0 10px #4fd07a}
.pm.hit{animation:sh .35s}
@keyframes sh{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
/* コマンド欄は高さ固定。わざ・どうぐの一覧は欄の下端から上へ重ねて出す（敵・ログ・パーティが動かない） */
#cmd{margin-top:6px;height:150px;flex:none;position:relative}
#cmd.over>.cmdBox{position:absolute;left:0;right:0;bottom:0;max-height:calc(100vh - 150px);overflow-y:auto;background:#0b1024f5;border:1px solid var(--line);border-radius:12px;padding:6px;z-index:4;box-shadow:0 -6px 18px #000a}
#cmd .sk{min-height:44px}
#bk{min-height:44px}
.cmdT{font-weight:800;font-size:14px;margin-bottom:4px;display:flex;justify-content:space-between}
.cgrid2{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.cb{padding:11px 4px;border-radius:12px;background:#1c2a5c;border:1px solid #4a63b8;font-weight:800;font-size:15px}
.cb.sp{background:linear-gradient(#a07a20,#5a420c);border-color:var(--gold)}
.cb:disabled{opacity:.35}
.cb small{display:block;font-size:10px;color:var(--sub);font-weight:700}
.pop{position:absolute;font-family:'Dela Gothic One','M PLUS 1p',system-ui,sans-serif;font-size:26px;color:#fff;text-shadow:0 0 8px #ff4040,0 2px 0 #000;animation:pop .9s forwards;pointer-events:none;z-index:3}
.pop.h{color:#9fe08a;text-shadow:0 0 8px #2a8a3a,0 2px 0 #000}
.pop.c{color:var(--gold);font-size:32px}
@keyframes pop{0%{transform:translateY(0) scale(.6);opacity:0}20%{transform:translateY(-8px) scale(1.15);opacity:1}100%{transform:translateY(-40px);opacity:0}}
/* なぞり・加工（共通） */
#craft{display:none;flex-direction:column;height:100%;padding:10px}
#craft.on{display:flex}
#craftT{font-weight:800;font-size:17px;text-align:center;color:var(--gold)}
#craftSub{font-size:13px;color:var(--sub);text-align:center;min-height:20px}
#stage{position:relative;flex:1;display:flex;align-items:center;justify-content:center;min-height:0;margin:6px 0}
#cv{touch-action:none;display:block}
#cv.round{border-radius:50%}
#cv.box{border-radius:14px;border:1px solid var(--line)}
#hud{position:absolute;top:2px;left:0;right:0;display:flex;justify-content:space-between;font-weight:800;font-size:14px;pointer-events:none;padding:0 6px}
#tbar{height:8px;border-radius:99px;background:#060a1a;overflow:hidden;margin:0 8%}
#tbar>i{display:block;height:100%;background:linear-gradient(90deg,#ff7a5a,#e8c35a)}
/* 町 */
#town{display:none;flex-direction:column;height:100%;padding:6px 8px}
#town.on{display:flex}
#townTop{display:flex;gap:6px;align-items:center}
#townTop .ttl{font-weight:800;font-size:15px;color:var(--gold);flex:1}
#townTop button{background:#141b38;border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-weight:800;font-size:13px}
#townTop .tbtn{padding:6px 7px;line-height:0;min-width:44px;min-height:44px}
#tWrap{flex:1;position:relative;min-height:0;margin:6px 0 0;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#0a0e1e}
#tcv{position:absolute;inset:0;touch-action:none;display:block}
/* どこでも出る半透明のスティック（触った場所に出て、指をずらした方向へ歩く） */
#tWrap{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#stick{position:absolute;width:112px;height:112px;margin:-56px 0 0 -56px;border-radius:50%;background:radial-gradient(#ffffff14,#ffffff26 68%,#ffffff40 70%,transparent 72%);border:2px solid #ffffff55;pointer-events:none;display:none;z-index:2}
#stick.on{display:block}
#stick i{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;background:#e8c35a66;border:2px solid #ffe7a0aa;box-shadow:0 0 12px #e8c35a55}
#tHint{position:absolute;left:0;right:0;top:0;padding:5px 10px;font-size:11px;color:#dfe6ff;background:linear-gradient(#0a0e1ecc,transparent);pointer-events:none;transition:opacity 1s}
#tHint.off{opacity:0}
/* 会話 */
.ov{position:fixed;inset:0;background:#000b;display:none;align-items:flex-end;justify-content:center;z-index:10;padding:12px 12px calc(12px + env(safe-area-inset-bottom))}
body.talking #stick{display:none}
.ov.on{display:flex}
#sheet{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;justify-content:center;z-index:9;padding:12px 12px calc(12px + env(safe-area-inset-bottom))}
#sheet.on{display:flex}
#sheet .shp{width:100%;max-width:520px;background:#141b38;border:2px solid var(--gold);border-radius:18px;padding:12px 14px 14px;animation:shup .18s ease-out}
@keyframes shup{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
#sheet .shh{display:flex;align-items:center;justify-content:space-between;font-weight:800;font-size:18px;color:var(--gold);margin-bottom:8px}
#sheet .shh span{display:flex;align-items:center;gap:6px}
#sheet .shh button{background:#0b1024;border:1px solid var(--line);border-radius:10px;width:44px;height:44px;font-size:18px;color:var(--ink)}
.itr{display:flex;align-items:center;gap:10px;background:#0b1024;border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin-top:6px}
.itr .itn{flex:1;min-width:0;display:flex;flex-direction:column}
.itr .itn b{font-size:16px}.itr .itn small{font-size:12px;color:var(--sub)}
.sk.itb{display:flex;align-items:center;gap:10px;text-align:left}
.sk.itb .itn{flex:1;display:flex;flex-direction:column}.sk.itb .itn small{font-size:11px;color:var(--sub)}
.itc{font-weight:800;font-size:18px;color:var(--gold);min-width:44px;text-align:right}.itc.z{color:var(--sub);opacity:.6}
#talk.ev{background:#000 center top/cover no-repeat}
#talk .box{width:100%;max-width:600px;height:196px;box-sizing:border-box;background:#141b38f5;border:2px solid var(--gold);border-radius:16px;padding:14px;display:flex;gap:12px;align-items:flex-start;margin-bottom:6vh}
#talk .box>div:last-child{display:flex;flex-direction:column;height:100%;min-width:0}
#talk .tface{width:96px;height:104px;flex:none;overflow:hidden;border-radius:10px;background:#0b1024}
#talk .tface img{display:block;width:180%;margin-left:-40%;margin-top:-4%;max-width:none}
#talk .who{font-weight:800;color:var(--gold);margin-bottom:4px;min-height:1.4em;flex:none}
#talk .who:empty{display:none}
#talk .txt{font-size:15px;line-height:1.7;white-space:pre-wrap;flex:1;overflow-y:auto;min-height:0}
#talk .nx{text-align:right;font-size:12px;color:var(--sub);margin-top:2px;flex:none}
#msg{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;text-align:center;z-index:8}
#msg>div{background:#0b1024f2;border:1px solid var(--gold);border-radius:16px;padding:14px 20px;font-weight:800;font-size:18px;line-height:1.6;max-width:86%;opacity:0;transform:scale(.9);transition:.2s}
#msg.on>div{opacity:1;transform:scale(1)}
.big{font-family:'Dela Gothic One','M PLUS 1p',system-ui,sans-serif;font-size:30px;color:var(--gold)}
#resBtns{position:sticky;bottom:0;padding:4px 0 calc(4px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 30%)}
#resP .endImg{width:100%;max-width:360px;max-height:45vh;aspect-ratio:1/1.05;object-fit:cover;object-position:top;border-radius:12px;display:block;margin:0 auto 6px}
.flash{position:fixed;inset:0;pointer-events:none;box-shadow:inset 0 0 60px #ff3030;opacity:0;transition:opacity .15s;z-index:5}.flash.on{opacity:.8}
/* パーティ詳細 */
.mem{display:flex;gap:10px;align-items:flex-start}
.mem img{width:96px;height:96px;object-fit:contain}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;font-size:13px;font-weight:800;margin:6px 0}
.stats div{background:#0e1430;border-radius:8px;padding:4px 6px;display:flex;align-items:center;line-height:1.4}
.sk{display:flex;justify-content:space-between;gap:6px;align-items:center;padding:8px;border-radius:10px;background:#0e1430;border:2px solid var(--line);margin:4px 0;font-size:13px;width:100%;text-align:left;min-height:44px}
.sk.on{border-color:var(--gold)}
.sk small{color:var(--sub)}
.new{display:inline-block;font-size:10px;font-weight:800;border-radius:99px;padding:0 6px;background:var(--red);color:#fff;margin-left:4px}

/* ===== v0.2 町の外（サバイバー）・工房 ===== */
#field.on{position:fixed;inset:0;max-width:none;padding:0;margin:0;overflow:hidden;background:#0b1024}
#fcv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#fstick{position:fixed;width:104px;height:104px;margin:-52px 0 0 -52px;border-radius:50%;background:radial-gradient(#ffffff10,#ffffff22 68%,#ffffff38 70%,transparent 72%);border:2px solid #ffffff44;pointer-events:none;display:none;z-index:3}
#fstick.on{display:block}

/* ===== v0.4 ホーム・編成・タブ（夜の紺・白・オレンジ1色） ===== */
:root{--sk:#0a0e1a;--sk2:#121828;--sw:#f2f4f8;--sm:#8790a6;--sl:#ffffff1f;--so:#ff7a2f;--so2:#ffb07a}
/* 共通：暗い紺の画面 */
#home,#party,#shop,#zukan{background:var(--sk)}
#party.on,#shop.on,#zukan.on{max-width:none}
#partyList,#shop>*,#zukan>*{max-width:600px;margin-left:auto;margin-right:auto}
body.hasTabs .scr.on{padding-bottom:calc(64px + env(safe-area-inset-bottom))}
/* 下のタブ：文字だけ。選んでいる所はオレンジの線 */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:none;background:#0a0e1af2;border-top:1px solid var(--sl);padding:0 4px env(safe-area-inset-bottom);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
#tabs .tab{flex:1;background:none;min-height:56px;display:flex;align-items:center;justify-content:center;position:relative}
#tabs .tab span{font-size:14px;font-weight:700;letter-spacing:.12em;color:var(--sm)}
#tabs .tab.on span{color:var(--sw)}
#tabs .tab.on::before{content:'';position:absolute;top:-1px;left:22%;right:22%;height:2px;background:var(--so)}
/* ホーム */
#home.on{display:block;max-width:none;padding:0;height:100%;min-height:0;position:relative;overflow:hidden}
.sbg{position:absolute;inset:0;pointer-events:none;
 background:linear-gradient(115deg,transparent 52%,#ff7a2f14 52%,#ff7a2f14 60%,transparent 60%),
  radial-gradient(ellipse at 78% 55%,#1c2a4a 0%,transparent 60%);}
.sbg::before{content:'';position:absolute;inset:0;background-image:linear-gradient(#ffffff0d 1px,transparent 1px),linear-gradient(90deg,#ffffff0d 1px,transparent 1px);background-size:24px 24px;
 -webkit-mask-image:radial-gradient(circle at 75% 50%,#000 0,transparent 55%);mask-image:radial-gradient(circle at 75% 50%,#000 0,transparent 55%)}
.sbg::after{content:'';position:absolute;right:-20%;top:18%;width:85vw;height:85vw;max-width:520px;max-height:520px;border-radius:50%;border:1px solid #ffffff14}
.sart{position:absolute;inset:0;pointer-events:none}
.sart .hmain{position:absolute;right:-16%;bottom:9%;height:72%;max-width:none;filter:drop-shadow(-12px 0 0 #ff7a2f22)}
.stop{position:absolute;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 14px) 20px 0;display:flex;align-items:flex-start;justify-content:space-between;gap:8px;z-index:3}
.sch{font-size:11px;letter-spacing:.2em;color:var(--sm);border-left:2px solid var(--so);padding-left:8px;line-height:1.5}
.sres{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.mpill{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--sm)}
.mpill b{font-family:ui-monospace,Menlo,monospace;font-weight:500;font-size:14px;color:var(--sw);min-width:22px;text-align:right}
.smenu{position:absolute;left:20px;top:20%;display:flex;flex-direction:column;gap:2px;z-index:3}
.smenu button{display:flex;align-items:baseline;gap:12px;background:none;padding:7px 0;text-align:left;min-height:44px;color:var(--sw)}
.smenu i{font-style:normal;font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--sm);width:18px}
.smenu b{font-weight:500;font-size:24px;letter-spacing:.14em;text-shadow:0 2px 12px #000a}
.smenu button:not(.sgo):active b,.smenu button:not(.sgo):hover b{color:var(--so2)}
.smenu .sgo{flex-wrap:wrap;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--sl);position:relative}
.smenu .sgo b{font-weight:800;font-size:46px;color:var(--so);letter-spacing:.1em;line-height:1}
.smenu .sgo b::after{content:' →';font-size:24px;font-weight:500;vertical-align:middle}
.smenu .sgo small{flex-basis:100%;padding-left:30px;font-size:12px;color:var(--sm);letter-spacing:.12em;margin-top:4px}
.smenu .sgo:active{transform:translateX(4px)}
.snext{position:absolute;left:20px;right:20px;bottom:calc(64px + env(safe-area-inset-bottom));z-index:3;display:flex;align-items:center;gap:10px;background:#0a0e1acc;border:1px solid var(--sl);padding:10px 12px;color:var(--sw);text-align:left;min-height:48px}

.snext .nm{flex:1;font-size:14px;font-weight:700}
.snext .na{color:var(--sm)}
.sfoot{position:absolute;left:20px;right:20px;bottom:calc(16px + env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:flex-end;z-index:3;font-size:13px;color:var(--sw);font-weight:700}
.slead small{display:block;font-size:10px;letter-spacing:.2em;color:var(--sm);font-weight:500}
.sprog{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--sm);letter-spacing:.1em}
.sbar{width:70px;height:2px;background:var(--sl)}.sbar i{display:block;height:100%;background:var(--so)}
/* 入るときの動き */
#home.enter .smenu button{animation:sIn .5s cubic-bezier(.2,.8,.2,1) both}
#home.enter .smenu button:nth-child(2){animation-delay:.05s}#home.enter .smenu button:nth-child(3){animation-delay:.1s}#home.enter .smenu button:nth-child(4){animation-delay:.15s}#home.enter .smenu button:nth-child(5){animation-delay:.2s}#home.enter .smenu button:nth-child(6){animation-delay:.25s}#home.enter .smenu button:nth-child(7){animation-delay:.3s}
#home.enter .sart .hmain{animation:sArt .7s cubic-bezier(.2,.8,.2,1) both}
#home.enter .snext{animation:sUp .5s .35s both}
@keyframes sIn{from{opacity:0;transform:translateX(-16px)}}
@keyframes sArt{from{opacity:0;transform:translateX(40px)}}
@keyframes sUp{from{opacity:0;transform:translateY(8px)}}
@media (prefers-reduced-motion:reduce){#home.enter *{animation:none!important}}

/* =====================================================================
   統一デザイン（ホーム・編成・結果画面に合わせる）
   ・地：黒に近い紺（--sk）、パネル：--sk2、線：--sl（白12%）
   ・差し色はオレンジ（--so）1色。数字の強調は淡い金（--sg）
   ・角は丸めない。大事なボタンだけ、右下を斜めに切る
   ===================================================================== */
:root{--bg:#0a0e1a;--panel:#121828;--line:#ffffff1f;--ink:#f2f4f8;--sub:#8790a6;--gold:#ffb07a;--sg:#ffd27a;--green:#5fe08a;--blue:#7fb2ff}
body{background:radial-gradient(120% 70% at 50% 15%,#182033 0%,#0a0e1a 70%)}
/* パネル・カード */
.panel,#sheet .shp,#talk .box,.fcard,.rcp,.zki,.itr,.cqmsg,.cqcands .cand{border-radius:0!important}
.panel{background:var(--sk2);border:1px solid var(--sl)}
.fcard{background:var(--sk2);border:1px solid var(--sl);border-top:2px solid var(--so);padding:14px;width:min(420px,92vw)}
.fcard h3{margin:0;text-align:center;font-size:20px;font-weight:900;letter-spacing:.14em;color:var(--sw)}
.fcard .note{text-align:center}
/* ボタン：ふつう＝線、大事＝オレンジ（右下を斜めに） */
.btn{border-radius:0;background:transparent;border:1px solid #ffffff40;color:var(--sw);font-weight:800;letter-spacing:.1em;box-shadow:none;text-shadow:none}
.btn:active{background:#ffffff14}
.btn.gold{background:var(--so);border-color:var(--so);color:#0a0e1a;clip-path:polygon(0 0,100% 0,100% 72%,calc(100% - 16px) 100%,0 100%)}
.btn.gold:active{background:var(--so2)}
.btn.ghost{border-color:var(--sl);color:var(--sm)}
.btn:disabled{opacity:1;border-color:var(--sl);background:transparent;color:#5a6278;clip-path:none}
#title .tbtns .btn.gold{font-size:20px;padding:16px;letter-spacing:.3em}
#title .tbtns .btn.ghost{background:#0a0e1acc}
/* 小さいボタン（戻る・ホームへ・閉じる） */
.back,.thome,#townTop button,#sheet .shh button,.ppx{border-radius:0!important;background:#0a0e1acc!important;border:1px solid #ffffff40!important;color:var(--sw)!important;font-weight:700;letter-spacing:.08em;box-shadow:none}
.thome{font-size:13px}
/* タグ（小さな札） */
.tag{border-radius:0;background:none;border:1px solid var(--sl);color:var(--sm);font-weight:700}
#shop .tag[style*="5a3a8a"]{background:none!important;border-color:var(--so);color:var(--so)}
#shop .tag[style*="background:#2a6a3a"],#shop .tag[style*="2a6a3a"]{background:none!important;border-color:var(--green);color:var(--green)}
/* 下から出るシート（メニュー・持ちもの） */
#sheet{background:#000b}
#sheet .shp{background:var(--sk2);border:1px solid var(--sl);border-top:2px solid var(--so)}
#sheet .shh{color:var(--sw);letter-spacing:.12em}
.itr{background:transparent;border:none;border-bottom:1px solid var(--sl);padding:8px 2px;margin-top:0}
.itr .itn b{font-size:15px}
/* 会話・お知らせ */
#talk .box{background:#0a0e1af2;border:1px solid var(--sl);border-top:2px solid var(--so)}
#talk .tface{border-radius:0;background:var(--sk2)}
#talk .who{color:var(--so);letter-spacing:.1em}
#msgIn{border-radius:0!important;background:#0a0e1aee!important;border:1px solid var(--sl)!important;border-left:3px solid var(--so)!important;color:var(--sw)}
/* レベルアップの候補 */
.fpick{background:var(--sk);border:1px solid var(--sl);border-radius:0}
.fpick:active{border-color:var(--so)}
.fpick .lvt{color:var(--so);letter-spacing:.05em}
/* フィールドの上の表示 */
#fPauseB{border-radius:0;background:#0a0e1acc;border:1px solid #ffffff40}
.fbar{border-radius:0;background:#000a;border-color:#ffffff26}
.fbar i{background:linear-gradient(90deg,#ff7a2f,#ffb07a)}
.fbar.hp i{background:linear-gradient(90deg,#3fbf6a,#8ef0a8)}
/* 工房・図鑑のカード */
.rcp{background:var(--sk2);border:none;border-left:2px solid var(--sl)}
.zki{background:var(--sk2);border:1px solid transparent}
/* 三面図 */
.cqstep{color:var(--so)}
.cqmsg{background:var(--sk2);border:1px solid var(--sl)}
.cqmsg img{border-radius:0;background:var(--sk)}
.cqcands .cand{background:var(--sk2);border:1px solid var(--sl)}
.cqcands .cand b{color:var(--so)}
.cqcands .cand.ok{border-color:var(--green);background:#15291e}
.cqrow button{border-radius:0;background:transparent;border:1px solid #ffffff40}
/* 武器づくり・設計の画面 */
#craftT{color:var(--sw);letter-spacing:.1em}

 g.party=g.party.filter((m,i,a)=>m&&typeof m==='object'&&CHARS[m.id]&&a.findIndex(x=>x&&x.id===m.id)===i);
 if(!g.party.length)return null;
 if(Number(g.v)>SAVE_V)loadNote='新しい版のセーブを読みこみました（うまく動かないときは、新しい版で遊んでください）';
 const it=g.items&&typeof g.items==='object'&&!Array.isArray(g.items)?g.items:{};g.items={};Object.keys(ITEMS).forEach(k=>{g.items[k]=Math.max(0,Math.floor(+it[k]||0))});
 g.mat=Math.max(0,Math.floor(+g.mat||0));g.cleared=Array.isArray(g.cleared)?g.cleared:['base'];if(!g.cleared.includes('base'))g.cleared.push('base');
 g.joined=Array.isArray(g.joined)?g.joined:[];g.opened=Array.isArray(g.opened)?g.opened:[];g.flags=g.flags&&typeof g.flags==='object'&&!Array.isArray(g.flags)?g.flags:{};
 g.restUsed=Array.isArray(g.restUsed)?g.restUsed:[];
 if(!AREAS[g.area])g.area='alley';
 if(!g.hero||!CHARS[g.hero])g.hero=g.party[0].id;
 g.party.forEach(m=>{if(!JOBS[m.job])m.job=CHARS[m.id].job;m.lv=clamp(Math.floor(+m.lv)||1,1,LV_CAP);m.exp=m.lv>=LV_CAP?0:Math.max(0,+m.exp||0);m.sp=clamp(+m.sp||0,0,SP_MAX)});
 /* 主人公がパーティにいなければ戻す（JOIN_ORDER は主人公を飛ばすので、二度と加わらなくなるのを防ぐ） */
 if(!g.party.some(m=>m.id===g.hero))g.party.unshift(newMember(g.hero,Math.max(...g.party.map(m=>m.lv))));
 g.party.forEach(m=>{m.learned=Array.isArray(m.learned)?m.learned.filter(s=>SKILLS[s]):[];m.skills=Array.isArray(m.skills)?m.skills.filter(s=>SKILLS[s]&&m.learned.includes(s)).slice(0,4):[];
  m.fresh=Array.isArray(m.fresh)?m.fresh.filter(s=>SKILLS[s]):[];learnUpTo(m);if(!m.skills.length&&m.learned.length)m.skills.push(m.learned[0]);
  m.weapon=fixWeapon(m);

 if(g.party.every(m=>m.hp<=0))g.party.forEach(m=>{m.hp=maxHp(m)});  /* 全員HP0のセーブは全快させる */
 fixTown(g);

 if(g.cleared.includes('b1'))g.flags.ai_alley=1;

const rotMQ=matchMedia('(min-aspect-ratio:1/1) and (max-height:499px)');let pauseAt=rotMQ.matches?performance.now():0,pausedTotal=0;
rotMQ.addEventListener?rotMQ.addEventListener('change',e=>{if(e.matches)pauseAt=performance.now();else if(pauseAt){pausedTotal+=performance.now()-pauseAt;pauseAt=0}}):0;
const gnow=()=>(pauseAt||performance.now())-pausedTotal;
const wait=ms=>new Promise(r=>{const end=gnow()+ms;(function t(){const left=end-gnow();if(left<=0&&!pauseAt)r();else setTimeout(t,Math.max(16,Math.min(200,left)))})()});
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
/* 入力の一時停止：会話を閉じた直後（ゴーストクリック・連打の抜け）や、コマンド決定の直後。会話の枠へのタップは止めない */
let inputLock=0;
function lockInput(ms){inputLock=Math.max(inputLock,performance.now()+ms)}
/* 止めている間にまた押されたら（連打が続いていたら）、さらに250ms止める。指を止めてから押せば効く */
['pointerdown','click'].forEach(t=>window.addEventListener(t,e=>{const now=performance.now();if(now<inputLock&&!(e.target.closest&&e.target.closest('#talk'))){e.stopPropagation();e.preventDefault();if(t==='pointerdown')inputLock=Math.max(inputLock,now+250)}},true));
function show(id){const sh=document.getElementById('sheet');if(sh)sh.classList.remove('on');document.querySelectorAll('body>.pop').forEach(p=>p.remove());document.querySelectorAll('.scr').forEach(s=>s.classList.toggle('on',s.id===id));window.scrollTo(0,0)}
const onScr=id=>$(id).classList.contains('on');
/* say：重なったときは最後の say だけが消す */
let sayN=0;

/* 会話の顔：仲間（CHARS）と、町の人（NPCS。img/ID.webp）。切り出し位置は PORTRAIT */

/* ================= 音 ================= */
let AC=null;
function audio(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}}
function tone(f,d,type='sine',v=.12,slide=0){if(!AC||OPT.mute)return;try{const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;if(slide)o.frequency.exponentialRampToValueAtTime(slide,AC.currentTime+d);g.gain.value=v;g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.connect(g).connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
let lastBuzz=0;
function buzz(){const n=performance.now();if(n-lastBuzz<120)return;lastBuzz=n;tone(110,.09,'square',.07);$('flash').classList.add('on');setTimeout(()=>$('flash').classList.remove('on'),90)}
const sfx={start:()=>tone(660,.15,'triangle',.1,990),hit:()=>tone(220,.25,'sawtooth',.12,60),perfect:()=>[784,988,1319].forEach((f,i)=>setTimeout(()=>tone(f,.25,'triangle',.12),i*90)),
 guard:()=>tone(520,.2,'triangle',.1,780),win:()=>[523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,.3,'triangle',.12),i*120)),lose:()=>[392,330,262].forEach((f,i)=>setTimeout(()=>tone(f,.35,'sine',.12),i*160)),
 cut:()=>tone(900+Math.random()*300,.04,'sawtooth',.025)};

/* ================= 魔法陣の形 ================= */
const TAU=Math.PI*2;
function poly(n,r=.9,rot=-Math.PI/2,step=1){const p=[];for(let i=0;i<=n;i++){const a=rot+TAU*((i*step)%n)/n;p.push([Math.cos(a)*r,Math.sin(a)*r])}return p}
function polar(f,a0,a1,N=600){const p=[];for(let i=0;i<=N;i++){const a=a0+(a1-a0)*i/N,r=f(a);p.push([Math.cos(a)*r,Math.sin(a)*r])}return p}
function shape(type,tier){
 switch(type){
  case 'ch':{if(tier===1)return poly(3);
   if(tier===2){const a=[-.7,.75],b=[.7,.75],c=[.7,-.15],d=[-.7,-.15],t=[0,-.85];return[a,d,t,c,a,b,d,c,b]}
   const L=1.76,d=.36,lens=[L,L,L,L-d,L-d,L-2*d,L-2*d,L-3*d,L-3*d],dirs=[[1,0],[0,1],[-1,0],[0,-1]];let x=-.88,y=-.88;const p=[[x,y]];
   lens.forEach((l,i)=>{x+=dirs[i%4][0]*l;y+=dirs[i%4][1]*l;p.push([x,y])});return p}
  case 'me':{const teeth={1:6,2:8,3:11}[tier],ro=.88,ri=.66,p=[];
   for(let i=0;i<teeth;i++){const a=-Math.PI/2+TAU*i/teeth,w=TAU/teeth;const seg=(r,b0,b1)=>{for(let k=0;k<=8;k++){const b=b0+(b1-b0)*k/8;p.push([Math.cos(b)*r,Math.sin(b)*r])}};seg(ro,a,a+w*.45);seg(ri,a+w*.5,a+w*.95)}
   p.push(p[0]);return p}
  case 'de':{const k={1:7,2:10,3:14}[tier],amp={1:.15,2:.16,3:.17}[tier],p=[];
   for(let i=0;i<=k*2;i++){const a=-Math.PI/2+TAU*i/(k*2),r=.74+(i%2?amp:-amp);p.push([Math.cos(a)*r,Math.sin(a)*r])}return p}
  case 'ke':{const n={1:4,2:6,3:8}[tier];return polar(a=>.3+.6*Math.abs(Math.sin(n*(a+Math.PI/2)/2+Math.PI/2)),-Math.PI/2,-Math.PI/2+TAU)}
  case 'ma':{const turns={1:1.4,2:2,3:2.6}[tier];return polar(a=>.9-.78*((a+Math.PI/2)/(TAU*turns)),-Math.PI/2,-Math.PI/2+TAU*turns,900)}
  case 'hikari':{const[n,s]={1:[5,2],2:[7,3],3:[9,4]}[tier];return poly(n,.9,-Math.PI/2,s)}
  case 'yami':{const[n,s]={1:[5,2],2:[7,2],3:[8,3]}[tier];return poly(n,.9,Math.PI/2,s)}
 }return poly(3)}
function resample(raw,ds=.012){const out=[raw[0]];let carry=0;
 for(let i=1;i<raw.length;i++){const[ax,ay]=raw[i-1],[bx,by]=raw[i];const L=Math.hypot(bx-ax,by-ay);if(!L)continue;let t=ds-carry;
  while(t<=L){out.push([ax+(bx-ax)*t/L,ay+(by-ay)*t/L]);t+=ds}carry=L-(t-ds)}
 out.push(raw[raw.length-1]);return out}

/* ================= キャンバス共通 ================= */
const cv=$('cv'),cx=cv.getContext('2d');
let S=300,SH=300,DPR=1,raf=0;
function sizeCanvas(ratio=1){const st=$('stage').getBoundingClientRect();S=Math.max(220,Math.min(st.width,(st.height-8)/ratio,760));SH=S*ratio;DPR=Math.min(2,window.devicePixelRatio||1);
 cv.style.width=S+'px';cv.style.height=SH+'px';cv.width=Math.round(S*DPR);cv.height=Math.round(SH*DPR);cx.setTransform(DPR,0,0,DPR,0,0)}
function hexA(h,a){const n=parseInt(h.slice(1),16);return`rgba(${n>>16&255},${n>>8&255},${n&255},${a})`}
let handler=null; /* 今動いているミニゲームの入力先 */
cv.addEventListener('pointerdown',e=>{if(!handler)return;e.preventDefault();audio();try{cv.setPointerCapture(e.pointerId)}catch(_){}handler.down(e)});
cv.addEventListener('pointermove',e=>{if(!handler)return;e.preventDefault();const evs=e.getCoalescedEvents?e.getCoalescedEvents():[];for(const ev of (evs.length?evs:[e]))handler.move(ev)});
const upH=e=>{if(handler)handler.up(e)};cv.addEventListener('pointerup',upH);cv.addEventListener('pointercancel',upH);

/* ================= ミニゲーム①：設計（なぞり） ================= */
const RUNES='匠磨鍛削締測研溶旋盤図面夜光闇歯車雷爪幻星';
let runeRot=0;
function drawRing(ctx,size,color,rot){const k=size*.44,c=size/2;ctx.save();ctx.translate(c,c);ctx.strokeStyle=hexA(color,.35);ctx.lineWidth=1.5;[1.08,1.0].forEach(r=>{ctx.beginPath();ctx.arc(0,0,r*k,0,TAU);ctx.stroke()});
 ctx.rotate(rot);ctx.fillStyle=hexA(color,.45);ctx.font=`${Math.round(size*.032)}px serif`;ctx.textAlign='center';ctx.textBaseline='middle';
 for(let i=0;i<RUNES.length;i++){ctx.save();ctx.rotate(TAU*i/RUNES.length);ctx.fillText(RUNES[i],0,-1.04*k);ctx.restore()}ctx.restore()}
function runDesign(o){return new Promise(res=>{
 cv.className='round';sizeCanvas(1);
 const K=S*.44,toPx=([x,y])=>[S/2+x*K,S/2+y*K];
 const full=resample(shape(o.type,o.tier)),m=Math.round((o.seg||CFG.SEG[o.tier])/.012);let pts=full;
 if(full.length>m+2){const s0=Math.floor(Math.random()*(full.length-m));pts=full.slice(s0,s0+m+1)}
 const n=pts.length,L=(n-1)*.012,small=Math.min(1.6,Math.max(1,480/S));
 const w=(o.w||CFG.WID[o.tier])*small*(o.wide?1.35:1),time=Infinity,endTol=o.full?1:Math.max(2,Math.ceil(w*.5/.012));  /* o.full=最後の点までなぞらないと到達100%にしない（工房） */
 window.__dbg={kind:'design',pts:pts.map(toPx)};
 const c={p:0,started:false,drawing:false,t0:0,inL:0,outL:0,last:null,trail:[],done:false,pulse:0};
 const evPos=e=>{const r=cv.getBoundingClientRect();return[((e.clientX-r.left)-S/2)/K,((e.clientY-r.top)-S/2)/K]};
 const near=(pos,a,b)=>{let bi=a,bd=1e9;for(let i=a;i<=b;i++){const q=pts[i],d=Math.hypot(q[0]-pos[0],q[1]-pos[1]);if(d<bd){bd=d;bi=i}}return[bi,bd]};
 $('hudL').textContent=o.label||'';$('hudR').textContent='光る点に触れてスタート';$('tfill').style.width='100%';
 function finish(){if(c.done)return;c.done=true;handler=null;const reach=c.p>=n-1-endTol?1:c.p/(n-1);if(reach>=1)$('hudR').textContent=`到達 100%　正確 ${(c.inL+c.outL)?Math.round(100*c.inL/(c.inL+c.outL)):100}%`;const tot=c.inL+c.outL,acc=tot>0?c.inL/tot:0;draw();setTimeout(()=>res({reach,acc,score:Math.round(reach*acc*100)}),350)}
 function step(pos){if(c.last){const seg=Math.hypot(pos[0]-c.last[0],pos[1]-c.last[1]);const[j,d]=near(pos,Math.max(0,c.p-10),Math.min(n-1,c.p+28));const ok=d<=w/2;
   if(ok)c.inL+=seg;else{c.outL+=seg;if(seg>.002)buzz()}if(d<w*1.7&&j>c.p)c.p=j;c.trail.push([pos[0],pos[1],ok]);if(c.trail.length>90)c.trail.shift();if(c.p>=n-1-endTol)finish()}c.last=pos}
 handler={down(e){const pos=evPos(e),q=pts[c.p];if(Math.hypot(pos[0]-q[0],pos[1]-q[1])>w*2.4){$('hudR').textContent=c.started?'光っている点から続きを':'光る点に触れてスタート';return}
   if(!c.started){c.started=true;c.t0=gnow();sfx.start()}c.drawing=true;c.last=pos},
  move(e){if(c.drawing&&!c.done)step(evPos(e))},up(){c.drawing=false;c.last=null}};
 function draw(){cx.clearRect(0,0,S,S);runeRot+=.002;c.pulse+=.08;const col=o.color;
  const g=cx.createRadialGradient(S/2,S/2,0,S/2,S/2,S/2);g.addColorStop(0,hexA(col,.10));g.addColorStop(1,'rgba(0,0,0,0)');cx.fillStyle=g;cx.fillRect(0,0,S,S);
  drawRing(cx,S,col,runeRot);const P=pts.map(toPx),wpx=w*K;cx.lineCap=cx.lineJoin='round';
  cx.beginPath();full.forEach((q,i)=>{const r=toPx(q);i?cx.lineTo(...r):cx.moveTo(...r)});cx.strokeStyle=hexA(col,.22);cx.lineWidth=2;cx.stroke();
  const path=(a,b)=>{cx.beginPath();cx.moveTo(...P[a]);for(let i=a+1;i<=b;i++)cx.lineTo(...P[i])};
  path(0,n-1);cx.strokeStyle=hexA(col,.18);cx.lineWidth=wpx;cx.stroke();cx.strokeStyle=hexA(col,.55);cx.lineWidth=1.2;cx.setLineDash([4,6]);cx.stroke();cx.setLineDash([]);
  if(c.p>0){path(0,c.p);cx.save();cx.shadowColor=col;cx.shadowBlur=16;cx.strokeStyle=col;cx.lineWidth=Math.max(4,wpx*.42);cx.stroke();cx.restore()}
  for(let i=1;i<c.trail.length;i++){const a=toPx(c.trail[i-1]),b=toPx(c.trail[i]);cx.beginPath();cx.moveTo(...a);cx.lineTo(...b);cx.strokeStyle=c.trail[i][2]?'rgba(255,255,255,.75)':'rgba(255,70,70,.95)';cx.lineWidth=3;cx.stroke()}
  if(!c.done){const q=P[c.p],nx=P[Math.min(n-1,c.p+10)],r=wpx*.55+Math.sin(c.pulse)*3;cx.beginPath();cx.arc(q[0],q[1],Math.max(8,r),0,TAU);cx.fillStyle=c.started?'rgba(255,255,255,.25)':hexA(col,.55);cx.fill();cx.strokeStyle='#fff';cx.lineWidth=2;cx.stroke();
   const ang=Math.atan2(nx[1]-q[1],nx[0]-q[0]),ar=Math.max(14,wpx*.9);cx.save();cx.translate(q[0]+Math.cos(ang)*ar,q[1]+Math.sin(ang)*ar);cx.rotate(ang);cx.beginPath();cx.moveTo(8,0);cx.lineTo(-5,-6);cx.lineTo(-5,6);cx.closePath();cx.fillStyle='#fff';cx.fill();cx.restore();
   const e=P[n-1];cx.beginPath();cx.arc(e[0],e[1],6,0,TAU);cx.strokeStyle='#e8c35a';cx.lineWidth=2;cx.stroke()}}
 cancelAnimationFrame(raf);
 (function loop(){draw();if(c.done)return;if(c.started){const el=gnow()-c.t0;const tot=c.inL+c.outL;
   $('hudR').textContent=`到達 ${Math.round(100*c.p/(n-1))}%　正確 ${tot?Math.round(100*c.inL/tot):100}%`;if(el>=time){finish();return}}raf=requestAnimationFrame(loop)})();
})}

/* ================= ミニゲーム②：加工（旋盤） ================= */
function makeProfile(tier){const N=160,k=CFG.LATHE_STEPS[tier],cuts=[0];
 while(cuts.length<k){const v=.15+Math.random()*.7;if(cuts.every(x=>Math.abs(x-v)>.16))cuts.push(v)}cuts.sort((a,b)=>a-b);cuts.push(1);
 const rs=[];for(let i=0;i<k;i++){let r;do{r=.5+Math.random()*.42}while(i&&Math.abs(r-rs[i-1])<.12);rs.push(+r.toFixed(2))}
 const taper=tier===3?Math.floor(Math.random()*k):-1;
 const tgt=[];for(let i=0;i<N;i++){const x=(i+.5)/N;let s=0;while(x>cuts[s+1])s++;
  if(s===taper){const nx=rs[s+1]??rs[s-1];const t=(x-cuts[s])/(cuts[s+1]-cuts[s]);tgt.push(rs[s]+(nx-rs[s])*t*.6)}else tgt.push(rs[s])}
 return{N,tgt,cuts,rs,taper}}
function runLathe(o){return new Promise(res=>{
 cv.className='box';sizeCanvas(1.15);
 const pr=makeProfile(o.tier),N=pr.N,T=CFG.LATHE_T[o.tier]*1000,LEAD=900;
 const W=S,H=SH,x0=W*.14,x1=W*.92,cy=H*.3,R0=H*.17,tol=o.tol||CFG.LATHE_TOL,[fOver,fUnder]=CFG.LATHE_FALL;
 const cur=new Array(N).fill(1);window.__dbg={kind:'lathe',x0,x1,cy,R0,tgt:pr.tgt,T,LEAD};
 /* 制限時間なし：刃物の先が指についてくる。左右で材料にそって動かし、上下で深さを決める。「仕上げる」で終わり */
 const c={started:false,t0:0,toolR:1.12,tx:x1+W*.03,drag:false,lastI:-1,done:false,parts:[],spin:0,cutAny:new Uint8Array(N)};
 const evP=e=>{const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top-24]};
 const cw0=(x1-x0)/N,idx=x=>Math.floor((x-x0)/cw0);
 function cutTo(nx,nr){const a=idx(c.tx),b=idx(nx),lo=Math.min(a,b),hi=Math.max(a,b);c.tx=nx;c.toolR=nr;
  for(let k=Math.max(0,lo);k<=Math.min(N-1,hi);k++){if(c.toolR<cur[k]){cur[k]=c.toolR;c.cutAny[k]=1;c.lastI=Math.max(c.lastI,k);if(Math.random()<.5){for(let q=0;q<2;q++)c.parts.push({x:x0+k*cw0,y:cy+c.toolR*R0,vx:Math.random()*4-1,vy:-Math.random()*4,l:20})}if(Math.random()<.15)sfx.cut()}}}
 /* ハンドル（実物の旋盤と同じ）：左＝往復台（刃物を左右へ）、右＝横送り（刃物の深さ）。指で円をえがくように回す。2本指で両方同時に回せる */
 const WY=H*.75,WR=Math.min(W*.17,H*.145),WX=[W*.27,W*.73],K0=(x1-x0)*.3/TAU,K1=.22/TAU;c.ang=[0,0];c.act=new Map();
 const rawP=e=>{const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
 const wheelAt=(x,y)=>y>H*.56?(x<W/2?0:1):-1;
 function turn(w,d){c.ang[w]+=d;if(w===0)cutTo(clamp(c.tx+d*K0,x0-W*.08,x1+W*.04),c.toolR);else cutTo(c.tx,clamp(c.toolR-d*K1,.3,1.12))}
 handler={down(e){if(c.done)return;const[x,y]=rawP(e),w=wheelAt(x,y);if(w<0)return;if(!c.started){c.started=true;c.t0=gnow();sfx.start();$('crDone').style.display=''}
   c.act.set(e.pointerId,{w,a:Math.atan2(y-WY,x-WX[w])});c.drag=true},
  move(e){const A=c.act.get(e.pointerId);if(!A||c.done)return;const[x,y]=rawP(e),a=Math.atan2(y-WY,x-WX[A.w]);let d=a-A.a;if(d>Math.PI)d-=TAU;if(d<-Math.PI)d+=TAU;A.a=a;
   /* 中心の近くは角度がとびやすいので、少しだけ動かす */
   const rr=Math.hypot(x-WX[A.w],y-WY);if(rr<WR*.25)d*=.3;turn(A.w,d)},
  up(e){if(e)c.act.delete(e.pointerId);c.drag=c.act.size>0}};
 window.__lathe={c,turn,cur,tgt:pr.tgt,x0,x1,N,R0};
 $('crDone').onclick=()=>finish();$('crDone').style.display='none';$('tbar').style.visibility='hidden';
 $('hudL').textContent=o.label||'';$('hudR').textContent='下のハンドルを回して削る';
 const ptsOf=i=>{const e=cur[i]-pr.tgt[i],ae=Math.abs(e);return ae<=tol?1:clamp(1-(ae-tol)/(e<0?fOver:fUnder),0,1)};
 function score(upTo=N){let s=0;for(let i=0;i<upTo;i++)s+=ptsOf(i);return upTo?s/upTo:1}
 function finish(){if(c.done)return;c.done=true;handler=null;$('crDone').style.display='none';$('tbar').style.visibility='';draw();setTimeout(()=>res({score:Math.round(score()*100)}),400)}
 function draw(){cx.clearRect(0,0,W,H);c.spin+=.25;
  const bg=cx.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#101a3c');bg.addColorStop(1,'#070b1c');cx.fillStyle=bg;cx.fillRect(0,0,W,H);
  /* チャック */
  cx.fillStyle='#3a4466';cx.fillRect(x0-W*.1,cy-R0*1.35,W*.1,R0*2.7);cx.fillStyle='#55618a';for(let j=0;j<3;j++){cx.fillRect(x0-W*.035,cy-R0*1.2+j*R0*.9,W*.03,R0*.55)}
  /* 材料 */
  const cw=(x1-x0)/N;
  /* 材料の陰影は1本のグラデーションを使い回す（毎フレーム160本作らない） */

const GROW_MAX=20;

/* 能力（パッシブ）は★で開く：★1＝R、★2＝SR、★3＝UR、★4＝LR、★5＝全部の能力が1.5倍（覚醒） */
const ABIL_RANK=[['R',1],['SR',2],['UR',3],['LR',4]];
const abOpen=(m,i)=>((m&&m.star)||1)>=ABIL_RANK[i][1];
const abBoost=m=>((m&&m.star)||1)>=5?1.5:1;
const ABIL={
 wolf:[{k:'teamAtk',v:.10,d:'チームの攻撃が+10%'},{k:'crit',v:.15,d:'牙刃連射が15%で会心（2倍）'},{k:'rage',v:.3,d:'体力が半分以下のとき、攻撃+30%'},{k:'startLv',v:1,d:'出撃したとき、ウルフの攻撃Lvが+1'}],
 fox: [{k:'pick',v:.2,d:'素材・経験値を吸い寄せる範囲+20%'},{k:'regen',v:2,d:'10秒ごとに体力を2回復'},{k:'orb',v:1,d:'まわる輪刃が1つ増える'},{k:'revive',v:.5,d:'1回だけ、力つきても体力50%で立ち上がる'}],
 dodo:[{k:'hp',v:15,d:'チームの最大体力+15'},{k:'cut',v:.1,d:'受けるダメージ−10%'},{k:'kb',v:1,d:'衝撃波で大きくふっとばす'},{k:'hamCd',v:.25,d:'衝撃波の間隔−25%'}],
 owl: [{k:'xp',v:.1,d:'経験値が+10%'},{k:'slow',v:1,d:'魔法陣の足止めが強くなる'},{k:'zone',v:1,d:'魔法陣が1つ増える'},{k:'lvSpd',v:.12,d:'レベルアップごとに移動速度が上昇（最大12%）'}]};
const RANK_COL={R:'#3fae5a',SR:'#2f7fd0',UR:'#8a3fd0',LR:'#c9962a'};
/* チーム全員の開いている能力を合計する（メダサバのチーム効果と同じ考え方） */
function teamAb(){const a={};G.party.forEach(m=>{(ABIL[m.id]||[]).forEach((ab,i)=>{if(abOpen(m,i))a[ab.k]=(a[ab.k]||0)+ab.v*abBoost(m)});const at=m.weapon&&m.weapon.attr;if(at){const k={thunder:'xp',steel:'cut',wind:'wspd'}[at.k];if(k)a[k]=(a[k]||0)+at.v}});return a}
const lvMul=m=>1+.05*((m&&m.lv||1)-1);
const memPow=m=>Math.round(100*starMul(m)*wMul(m)*lvMul(m));
function teamPow(){const a=teamAb();return Math.round(G.party.reduce((s,m)=>s+memPow(m),0)*(1+(a.teamAtk||0)))}
function teamHp(){const a=teamAb(),L=G.party.find(m=>m.id===G.lead);return Math.round(FCFG.HP+5*((L&&L.lv||1)-1)+30*armMul('head')+(a.hp||0))}

 ${pickSlot==null?equipRowHTML():pickerHTML()}

/* 入れかえ中は、イラストを小さくして能力を見やすく。スクロールしなくても一覧まで見える */
function previewTeam(k,id){const P=G.party.slice(),B=(G.bench||[]).slice();let r=null;

 <div class="pcab">${ab.map((x,i)=>{const [r,need]=ABIL_RANK[i],open=abOpen(m,i);return `<div class="abrow ${open?'':'lock'}"><span class="abtag" style="background:${RANK_COL[r]}">${r}</span><span class="abd">${open?'':`<i>★${need}で開く</i>`}${x.d}${open&&abBoost(m)>1?' <b class="awk">×1.5</b>':''}</span></div>`}).join('')}</div>

 const list=ownedAll().slice().sort((a,b)=>(b.star||1)-(a.star||1)||b.lv-a.lv);
 const label=k===0?'リーダーの枠':`${k+1}番目の枠`;
 let act='';if(false&&y&&(!x||x.id!==y.id)){const yIn=G.party.some(p=>p.id===y.id);act=yIn&&!x?`<span class="ppn">${CHARS[y.id].name}はもうパーティにいる</span>`:`<button class="lvup pin" id="ppIn">${CHARS[y.id].name}を${x?(yIn?'入れかえる':'この枠に入れる'):'この枠に入れる'}</button>`}
 else act=`<span class="ppn">${x?'入れかえるキャラをタップ':'入れるキャラをタップ'}</span>`;

const SHAPE_SPR={};

function shapeCanvas(h,w=120,col='#c9d2e2'){const key=h+w+col;if(SHAPE_SPR[key])return SHAPE_SPR[key];const b=unpackShape(h),big=b.length>=GSW*GSH,CW=big?GSW:30,CH=big?GSH:18,c=document.createElement('canvas'),s=w/CW;c.width=w;c.height=Math.round(CH*s);const g=c.getContext('2d');
 const on=(x,y)=>x>=0&&y>=0&&x<CW&&y<CH&&b[y*CW+x];
 for(let y=0;y<CH;y++)for(let x=0;x<CW;x++)if(on(x,y)){const edge=!on(x,y-1)||!on(x-1,y);g.fillStyle=edge?'#ffffff':col;g.fillRect(x*s,y*s,s+.5,s+.5)}
 g.globalCompositeOperation='source-atop';const gr=g.createLinearGradient(0,0,0,c.height);gr.addColorStop(0,'#ffffff55');gr.addColorStop(.5,'#00000000');gr.addColorStop(1,'#00000055');g.fillStyle=gr;g.fillRect(0,0,c.width,c.height);return SHAPE_SPR[key]=c}
const shapeImg=(h,w)=>h?`<img class="wshape" src="${shapeCanvas(h,w||120).toDataURL()}" alt="">`:'';

/* グラインダー加工：砥石は画面の下に固定。鉄を指で動かして砥石に押し当てて削る。⟲⟳で鉄の向きを変える */
function runGrind(o){return new Promise(res=>{
 const sec=$('grind'),cv=$('gcv'),g=cv.getContext('2d'),tier=o.tier||1,R=GRIND_WHEEL[tier],T=GRIND_TIME[tier];
 const tgt=targetMask(o.who),mat=new Uint8Array(GW*GH);
 const bx0=Math.round(GW*.04),bx1=Math.round(GW*.96),by0=Math.round(GH*.14),by1=Math.round(GH*.86);
 for(let y=by0;y<by1;y++)for(let x=bx0;x<bx1;x++)mat[y*GW+x]=1;
 let tgtN=0;for(const v of tgt)tgtN+=v;
 $('gTitle').innerHTML=UIMG('m_steel',26)+' '+(o.title||'グラインダー加工');$('gSub').textContent='鉄を指で動かし、下の砥石に押し当てて削る。⟲⟳で向きを変えて、点線の形に合わせよう';
 show('grind');
 /* 作業台（ステージ）の大きさと砥石の位置（どちらも鉄のマス単位） */
 const SW=GW*1.45,SH=GH*2.35,WX=SW/2,WY=SH-2;
 const K=6,metal=document.createElement('canvas');metal.width=GW*K;metal.height=GH*K;
 {const m=metal.getContext('2d');for(let y=0;y<GH;y++)for(let x=0;x<GW;x++)if(mat[y*GW+x]){const n=Math.abs(Math.sin(x*12.9+y*78.2)*43758.5)%1;m.fillStyle=`hsl(215,${8+n*6}%,${40+n*10}%)`;m.fillRect(x*K,y*K,K,K)}}
 let S=1,DPR=Math.min(2,devicePixelRatio||1),left=T,done=false,last=0,pid=null,lx=0,ly=0,sparks=[],grinding=0,spin=0;
 let cx=SW/2,cy=WY-R-GH/2-4,ang=0,angT=0;
 function fit(){const w=Math.min(innerWidth-24,520,(innerHeight-260)*SW/SH);S=w/SW;cv.style.width=w+'px';cv.style.height=SH*S+'px';cv.width=Math.round(w*DPR);cv.height=Math.round(SH*S*DPR)}
 fit();
 function score(){let inter=0,uni=0;for(let i=0;i<mat.length;i++){const a=mat[i],b=tgt[i];if(a&&b)inter++;if(a||b)uni++}const iou=inter/uni;return{iou,q:Math.round(clamp((iou-.45)/.53,0,1)*100),broke:tgtN-inter}}
 /* 作業台の点 → 鉄のマス */
 function toPiece(sx,sy){const dx=sx-cx,dy=sy-cy,c=Math.cos(ang),s=Math.sin(ang);return[dx*c+dy*s+GW/2,-dx*s+dy*c+GH/2]}
 const reach=Math.hypot(GW,GH)/2;
 function grindNow(){if(Math.abs(ang-angT)>.001)return;if(Math.hypot(cx-WX,cy-WY)>R+reach)return;
  let n=0;const m=metal.getContext('2d');
  for(let sy=WY-R;sy<=WY+R;sy+=.5)for(let sx=WX-R;sx<=WX+R;sx+=.5){if((sx-WX)**2+(sy-WY)**2>R*R)continue;
   const[px,py]=toPiece(sx,sy),x=Math.floor(px),y=Math.floor(py);if(x<0||y<0||x>=GW||y>=GH)continue;const i=y*GW+x;
   if(mat[i]){mat[i]=0;n++;m.clearRect(x*K,y*K,K,K);if(sparks.length<200&&Math.random()<.5)sparks.push({x:sx,y:sy,vx:1.5+Math.random()*2.5,vy:-(1+Math.random()*2),t:0,red:tgt[i]})}}
  if(n)grinding=6;return n}
 const pos=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)/S,(e.clientY-r.top)/S]};
 function moveBy(dx,dy){/* 砥石に当たっている間は、少し重く動く */
  const touching=Math.hypot(cx-WX,cy-WY)<R+reach;const k=touching?.65:1,d=Math.hypot(dx,dy)*k,steps=Math.max(1,Math.ceil(d/(R*.25)));
  for(let i=0;i<steps;i++){cx=clamp(cx+dx*k/steps,-GW*.2,SW+GW*.2);cy=clamp(cy+dy*k/steps,-GH*.4,WY);grindNow()}}
 cv.onpointerdown=e=>{if(done)return;e.preventDefault();pid=e.pointerId;try{cv.setPointerCapture(pid)}catch(_){}[lx,ly]=pos(e)};
 cv.onpointermove=e=>{if(e.pointerId!==pid||done)return;const[x,y]=pos(e);moveBy(x-lx,y-ly);lx=x;ly=y};
 cv.onpointerup=cv.onpointercancel=e=>{if(e.pointerId===pid)pid=null};
 const rot=d=>{if(done)return;angT+=d*Math.PI/4;tone(500,.05,'triangle',.05,600)};
 $('gRotL').onclick=()=>rot(-1);$('gRotR').onclick=()=>rot(1);
 $('gDone').onclick=()=>finish();
 function finish(){if(done)return;done=true;cancelAnimationFrame(raf);const s=score();sec.querySelector('#gDone').onclick=null;res({score:s.q,iou:s.iou,shape:packShape(mat)})}
 let raf=0;
 function frame(now){const dt=last?Math.min(.1,(now-last)/1000):0;last=now;/* 制限時間なし。「仕上げる」で終わる */
  /* 向きを変えるときは、なめらかに回す */
  if(Math.abs(ang-angT)>.001){const st=dt*7;ang+=clamp(angT-ang,-st,st);if(Math.abs(ang-angT)<=.001)ang=angT}
  grindNow();spin+=dt*30;
  g.setTransform(DPR,0,0,DPR,0,0);g.clearRect(0,0,cv.width,cv.height);
  g.fillStyle='#0f1424';g.fillRect(0,0,SW*S,SH*S);g.strokeStyle='#ffffff0d';g.lineWidth=1;for(let x=0;x<=SW;x+=8){g.beginPath();g.moveTo(x*S,0);g.lineTo(x*S,SH*S);g.stroke()}for(let y=0;y<=SH;y+=8){g.beginPath();g.moveTo(0,y*S);g.lineTo(SW*S,y*S);g.stroke()}

  const P=GRIND_SHAPE[o.who]||GRIND_SHAPE.wolf;g.strokeStyle='#ffffffcc';g.setLineDash([6,4]);g.lineWidth=1.6;g.beginPath();P.forEach(([x,y],i)=>i?g.lineTo(x*GW*S,y*GH*S):g.moveTo(x*GW*S,y*GH*S));g.closePath();g.stroke();g.setLineDash([]);

  g.fillStyle='#3a3f4c';g.beginPath();g.arc(0,0,R*S+6,Math.PI,TAU);g.fill();
  const gr=g.createRadialGradient(0,0,R*S*.2,0,0,R*S);gr.addColorStop(0,'#8a8f9c');gr.addColorStop(1,'#5a606c');g.fillStyle=gr;g.beginPath();g.arc(0,0,R*S,0,TAU);g.fill();
  g.rotate(spin);g.strokeStyle='#ffffff22';g.lineWidth=2;for(let i=0;i<12;i++){g.rotate(TAU/12);g.beginPath();g.moveTo(R*S*.35,0);g.lineTo(R*S*.95,0);g.stroke()}
  g.restore();
  g.strokeStyle=grinding>0?'#ffb07a':'#ff7a2f88';g.lineWidth=2.5;g.beginPath();g.arc(WX*S,WY*S,R*S,Math.PI*1.1,Math.PI*1.9);g.stroke();

  const s=score();$('gTime').textContent='';$('gMatch').textContent=`形の一致 ${s.q}%`;$('gMatch').className=s.broke>tgtN*.03?'bad':'';
  $('gWarn').textContent=s.broke>tgtN*.03?'削りすぎ！ 形が欠けている':'';

 return h}

 if(R.kind==='armor')invPut({rid:pc.rid,rank:pc.rank,mul:pc.mul},R.slot);else invW().push({who:who.id,w:weaponObj(R,pc,who)})}

 if(R.kind==='armor')return[['効果',`${ARMOR_FX[R.slot].d(b)}（B）`],['出来ばえで',`${ARMOR_FX[R.slot].d(lo)}（C）〜 ${ARMOR_FX[R.slot].d(hi)}（SS）`]];

/* ===================== 換金所：しまってある装備はコインに、工具は基本素材に ===================== */
/* 売値＝階（壱・弐・参）の基本値 × 出来ばえの倍率。SS は高く売れる */
const SELL_BASE={1:12,2:30,3:70};
const SELL_RANK={D:.4,C:.6,B:1,A:1.5,S:2.5,SS:4};
const sellPrice=(rid,rank)=>Math.round(SELL_BASE[RECIPES[rid].tier]*(SELL_RANK[rank]||1));
/* 工具は基本素材（鉄くず・ボルト・鉄板）にもどる。値段が高い工具ほど多い */
function toolScrap(t){if(TOOLS[t].limited)return{scrap:4,bolt:2,plate:1};const p=TOOLS[t].price||0,o={scrap:Math.max(1,Math.round(p/30))};if(p>=90)o.bolt=Math.round(p/90);if(p>=240)o.plate=Math.round(p/160);return o}
const scrapTxt=o=>Object.keys(o).map(k=>`${MIC(k,16)}${MATS[k].n}×${o[k]}`).join('　');
function recItems(){const L=[];
 invW().forEach((x,i)=>L.push({key:'w:'+i,rid:x.w.rid,rank:x.w.rank,kind:'専用武器',sub:CHARS[x.who].name,ic:WPIC(x.who,34,RECIPES[x.w.rid].tier)}));

/* ===================== 工具の練度（使い込み）：使うほど上がり、その工具を使う加工が楽になる ===================== */
/* G.tlx：{工具: 経験}。Lv1〜5。被った工具（工具ガチャ）でも大きく上がる */
const TLV_XP=[0,30,80,160,300];
const tlv=t=>{const x=(G.tlx||{})[t]||0;let l=1;TLV_XP.forEach((v,i)=>{if(x>=v)l=i+1});return TOOLS[t]&&TOOLS[t].limited?Math.max(3,l):l};
/* そのレシピで使う工具のうち、いちばん練度の高いもの */
const recLv=R=>Math.max(1,...R.tools.filter(hasTool).map(t=>tlv(useTool(t))));
/* グラインダー・旋盤など、ずれの幅を変えにくい加工は点数ボーナスで助ける（Lv5で+8点）。ほかは各ミニゲームで幅が広がる */
let toolBonus=R=>{const pr=procOf(R);return (['grind','lathe'].includes(pr)||!MINI[pr]?(recLv(R)-1)*2:0)+(pr==='lathe'&&hasLim('cnc')?5:0)};
let assistMul=o=>1+.08*(((o&&o.assist)||1)-1);   /* Lv5で許す幅が+32% */
function toolXpGain(R,q){G.tlx=G.tlx||{};const g=5+Math.round(q/10),msg=[];
 R.tools.filter(hasTool).map(useTool).forEach(t=>{const b=tlv(t);G.tlx[t]=(G.tlx[t]||0)+g;const a=tlv(t);msg.push(`${MIC(t,18)}${TOOLS[t].n} 練度+${g}${a>b?` <b>Lv${a}に上がった！</b>`:''}`)});
 return msg.join('<br>')}
function tlvHTML(t){const x=(G.tlx||{})[t]||0,l=tlv(t),nx=TLV_XP[l],pv=TLV_XP[l-1];
 return `<div class="tlv">${UIMG('u_tlv',16)}<span>練度 <b>Lv${l}</b></span><i><u style="width:${l>=5?100:Math.round((x-pv)/(nx-pv)*100)}%"></u></i><small>${l>=5?'最大':`${x}/${nx}`}</small></div>`}

 spanner2:['lathe','drill'],hammer2:['hit','weld'],pen1:['lathe','wire'],rod2:['grind','wire'],laser2:['lathe','wire'],bow2:['cut','weld'],guitar2:['weld','wire'],

/* ---------- ねじ切り：タップハンドルを回す。半回転すすめて、1/4もどす（切りくずを切る）。もどさず回すと折れる ---------- */
const TAP_TURNS={1:4,2:6,3:8};   /* 必要な正味の回転（半回転＝1） */
function runTap(o){return new Promise(res=>{

 const {cv,g,W,H}=forgeOpen(o.title||'タップでねじ切り','ハンドルを回す。右回りで半回転すすめたら、左回りで1/4もどす。もどさずに回し続けると、タップが折れる','t_tap');
 const cx=W/2,cy=H*.5,RR=Math.min(W,H)*.36;
 let ang=0,net=0,fwd=0,back=0,cyc=[],pid=null,la=0,done=false,raf=0,msg='',msgT=0,last=0,broke=0;
 const LIM=Math.PI*1.65*AM;   /* もどさずに回せる限度（約300°） */
 const score=()=>{const q=cyc.length?cyc.reduce((a,b)=>a+b,0)/cyc.length:0;return Math.max(0,Math.round(q*100-broke*20))};
 function closeCycle(fin){if(fwd<.2)return;const deg=fwd*180/Math.PI;if(fin&&deg<140){fwd=0;return}const q=deg>=140&&deg<=250?1:deg<140?Math.max(.55,deg/140):Math.max(.3,1-(deg-250)/80);cyc.push(q);
  msg=q>.9?'いいリズム！':deg<140?'もう少しすすめてから':'もっと早くもどそう';msgT=1;fwd=0}
 function finish(){if(done)return;done=true;cancelAnimationFrame(raf);cv.onpointerdown=cv.onpointermove=cv.onpointerup=null;$('fgDone').onclick=null;res({score:score(),reach:Math.min(1,net/NEED)})}

   if(fwd>LIM){broke++;msg='タップが折れた！ 1/4もどそう';msgT=1.5;tone(80,.3,'square',.08,40);net=Math.max(0,net-Math.PI);fwd=0;cyc.push(0)}}
  else{back+=-d;net=Math.max(0,net+d*.3)}
  if(net>=NEED){closeCycle(true);setTimeout(finish,500);net=NEED}}
 function draw(){g.clearRect(0,0,W,H);
  /* 穴（上から見たところ） */
  g.fillStyle='#4a5670';g.fillRect(W*.08,H*.1,W*.84,H*.8);g.fillStyle='#141a2c';g.beginPath();g.arc(cx,cy,RR*.16,0,TAU);g.fill();
  /* ハンドル */
  g.save();g.translate(cx,cy);g.rotate(ang);g.fillStyle='#8a5a32';g.fillRect(-RR,-9,RR*2,18);g.fillStyle='#e05a3a';g.fillRect(-RR,-11,RR*.3,22);g.fillRect(RR*.7,-11,RR*.3,22);g.fillStyle='#c9d2e4';g.fillRect(-14,-14,28,28);g.restore();

  const lv=Math.min(1,fwd/LIM),gw=W*.6,gx=(W-gw)/2;g.fillStyle='#ffffff18';g.fillRect(gx,H*.04,gw,8);g.fillStyle=lv<.6?'#4fd07a':lv<.85?'#e8c35a':'#ff5a5a';g.fillRect(gx,H*.04,gw*lv,8);
  g.fillStyle='#9aa6c4';g.font='600 11px sans-serif';g.textAlign='center';g.fillText('切りくずのたまり（赤で折れる）',W/2,H*.04+22);
  g.fillStyle='#ffffff18';g.fillRect(gx,H*.93,gw,8);g.fillStyle='#5aa8ff';g.fillRect(gx,H*.93,gw*Math.min(1,net/NEED),8);g.fillText('ねじの深さ',W/2,H*.93-6);
  if(msgT>0){g.globalAlpha=Math.min(1,msgT*2);g.fillStyle='#ffe066';g.font='800 20px sans-serif';g.fillText(msg,W/2,H*.2);g.globalAlpha=1}}
 function loop(ts){const dt=last?Math.min(.05,(ts-last)/1000):0;last=ts;msgT=Math.max(0,msgT-dt);$('fgInfo').textContent=`深さ ${Math.round(Math.min(1,net/NEED)*100)}%　リズム ${score()}点`;draw();if(!done)raf=requestAnimationFrame(loop)}
 const pos=e=>{const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
 cv.onpointerdown=e=>{e.preventDefault();pid=e.pointerId;try{cv.setPointerCapture(pid)}catch(_){}const[x,y]=pos(e);la=Math.atan2(y-cy,x-cx)};

 * サーバーに預ける機能は、塔2にサーバーがないので入れていない */
const GEN_KEY='mmrpg2_gen',PREV_KEY='mmrpg2_prev',CODE_HEAD='MT2S.';
const sgYmd=t=>new Date(t+9*3600e3).toISOString().slice(0,10);
function saveCode(raw){const b=new TextEncoder().encode(raw);let s='';b.forEach(x=>s+=String.fromCharCode(x));return CODE_HEAD+btoa(s)}
/* コードを読んで、migrate を通った生の文字列を返す（読めなければ例外） */
function readCode(c){c=String(c||'').replace(/\s+/g,'');const i=c.indexOf(CODE_HEAD);if(i<0)throw new Error('head');
 const raw=new TextDecoder().decode(Uint8Array.from(atob(c.slice(i+CODE_HEAD.length)),x=>x.charCodeAt(0)));
 const g=migrate(JSON.parse(raw));if(!g)throw new Error('bad');return JSON.stringify(g)}
function curRaw(){if(G&&!inBattle)save();try{return localStorage.getItem(KEY)}catch(e){return null}}
/* 生の文字列でセーブを入れかえて読みこみ直す（今のデータは mmrpg2_prev へ） */
function applyRaw(raw,msg){try{const now=localStorage.getItem(KEY);if(now)localStorage.setItem(PREV_KEY,now);localStorage.setItem(KEY,raw)}
 catch(e){say('この端末では書きこめませんでした',1600);return}
 saveBlocked=true;closeSheet();say(msg||'セーブデータを読みこみました',1200).then(()=>location.reload())}
function sgSummary(raw){try{const g=JSON.parse(raw);const h=g.party&&g.party[0];const fl=g.floor|0;
 return `${(g.party||[]).length}人`+(h&&h.lv?`・Lv${Math.max(...g.party.map(m=>m.lv||1))}`:'')+(fl?`・最高${fl}F`:'')}catch(e){return''}}
/* 確認パネル（confirm() は出ない場面があるのでゲーム内で聞く） */
function sgAsk(html,yes,onYes){$('sheetT').textContent='確認';
 $('sheetB').innerHTML=`<div style="text-align:center;line-height:1.7;margin:6px 0 10px">${html}</div><button class="btn gold" id="sgY">${yes}</button><button class="btn ghost" id="sgN">やめる</button>`;
 $('sgN').onclick=openSaveGuard;$('sgY').onclick=onYes;$('sheet').classList.add('on')}
function saveFile(){const raw=curRaw();if(!raw){say('まだセーブがありません',1200);return}
 const d=sgYmd(Date.now()),txt=`マイスターの塔2 セーブデータ（${d}）\n設定 →「セーブの守り」→「ファイルから読み込む」で元にもどせます。\n\n${saveCode(raw)}\n`;
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'text/plain'}));a.download=`meister-tower2-save-${d}.txt`;
 document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000);
 OPT.bkF=Date.now();saveOpt();say('セーブをファイルに保存しました<br><span style="font-size:14px">（iPhone は「ファイル」→「ダウンロード」）</span>',2000)}
function loadFile(){const inp=document.createElement('input');inp.type='file';inp.accept='.txt,text/plain';
 inp.onchange=async()=>{const f=inp.files[0];if(!f)return;let raw;try{raw=readCode(await f.text())}catch(e){say('セーブのファイルではないようです',1600);return}
  sgAsk(`このファイルのセーブ（${sgSummary(raw)}）で<br>今のデータを上書きしますか？<br><span style="font-size:13px;opacity:.8">今のデータは「ひとつ前にもどす」で戻せます</span>`,'上書きして読みこむ',()=>applyRaw(raw))};
 inp.click()}
function genList(){try{const g=JSON.parse(localStorage.getItem(GEN_KEY)||'[]');return Array.isArray(g)?g.filter(x=>x&&x.d&&typeof x.c==='string'):[]}catch(e){return[]}}
/* 起動時：読めたセーブだけを1日1回控えに残す。読めなかったときは何も上書きしない */
function saveGuardBoot(){try{if(OPT.bkF===undefined){OPT.bkF=Date.now();saveOpt()}
 if(!G||!SAVE_RAW)return;const d=sgYmd(Date.now()),g=genList();if(g[0]&&g[0].d===d)return;
 g.unshift({d,c:SAVE_RAW});const out=g.slice(0,3);
 try{localStorage.setItem(GEN_KEY,JSON.stringify(out))}catch(e){try{localStorage.setItem(GEN_KEY,JSON.stringify(out.slice(0,1)))}catch(_){}}}catch(e){}}

  ${prev?`<div class="sgg"><span>ひとつ前のデータ<small>${sgSummary(prev)}</small></span><button class="btn" id="sgPrev">ひとつ前にもどす</button></div>`:''}
  ${G&&!G.flags.inh?'<div class="sgh">マイスターの塔（サイコロ版）から</div><button class="btn" id="sgInh">仲間とコインを引き継ぐ</button>':''}
  <div class="sgh">別の端末へ引っ越し</div>

  <div class="sgr"><button class="btn" id="sgExp">コードを書き出す</button><button class="btn" id="sgCopy" style="display:none">コピー</button></div>
  <textarea id="sgCode" class="sgc" placeholder="MT2S. で始まるコードを貼り付けて「読み込む」" aria-label="セーブコード" autocomplete="off" autocapitalize="off" spellcheck="false"></textarea>
  <button class="btn" id="sgImp">貼ったコードを読み込む</button>
  </div><button class="btn ghost" id="sgX">閉じる</button>`;
 {const ib=$('sgInh');if(ib)ib.onclick=openInherit}$('sgX').onclick=closeSheet;$('sgFile').onclick=saveFile;$('sgLoad').onclick=loadFile;
 $('sgExp').onclick=()=>{const raw=curRaw();if(!raw){say('まだセーブがありません',1200);return}$('sgCode').value=saveCode(raw);$('sgCopy').style.display=''};
 $('sgCopy').onclick=async()=>{const t=$('sgCode');try{await navigator.clipboard.writeText(t.value);say('コピーしました',900)}catch(e){t.focus();t.select();say('選択しました。長押しでコピーしてください',1500)}};
 $('sgImp').onclick=()=>{const c=$('sgCode').value.replace(/\s+/g,'');if(!c.startsWith(CODE_HEAD)){say('「MT2S.」で始まるコードを貼り付けてください',1600);return}
  let raw;try{raw=readCode(c)}catch(e){say('コードが途中で切れているようです。<br>全部コピーできているか確かめてください',2000);return}
  sgAsk(`このコードのセーブ（${sgSummary(raw)}）で<br>今のデータを上書きしますか？`,'上書きして読みこむ',()=>applyRaw(raw))};
 $('sheetB').querySelectorAll('[data-gen]').forEach(b=>b.onclick=()=>{const x=gens[+b.dataset.gen];
  try{migrate(JSON.parse(x.c))||0}catch(e){say('この控えは読めませんでした',1400);return}
  sgAsk(`${x.d} の控え（${sgSummary(x.c)}）に戻しますか？<br><span style="font-size:13px;opacity:.8">今のデータは「ひとつ前にもどす」で戻せます</span>`,'この日に戻す',()=>applyRaw(x.c,`${x.d} の控えに戻しました`))});
 const pv=$('sgPrev');if(pv)pv.onclick=()=>sgAsk('ひとつ前のデータに戻しますか？','戻す',()=>applyRaw(prev,'ひとつ前のデータに戻しました'));
 $('sheet').classList.add('on')}
/* ホームでほかの表示（シート・会話・ポップアップ）が出ていたら案内しない */
function sgBusy(){const on=id=>{const e=$(id);return e&&e.classList.contains('on')};return on('sheet')||on('talk')||!on('home')||!!document.querySelector('.fov.on,.pop2,.rpop')}
/* こまめに保存の案内：7日ファイル保存していなければ、ホームで3日に1回 */
function bkNag(){if(!G)return;const now=Date.now();if(now-(OPT.bkF||now)<7*86400e3||now-(OPT.bkN||0)<3*86400e3)return;
 if(sgBusy())return;
 OPT.bkN=now;saveOpt();$('sheetT').textContent='💾 セーブをこまめに残そう';
 $('sheetB').innerHTML=`<div class="note" style="line-height:1.7">セーブはこのスマホのブラウザの中にあります。iPhoneのSafariは、しばらく開かないとデータを消すことがあります。<br><b>ファイルに保存</b>しておけば、消えても元にもどせます。</div>
  <button class="btn gold" id="ngF">ファイルに保存</button><button class="btn ghost" id="ngX">あとで</button>`;
 $('ngF').onclick=()=>{closeSheet();saveFile()};$('ngX').onclick=closeSheet;$('sheet').classList.add('on')}
{const _oh=openHome;openHome=function(){const r=_oh.apply(this,arguments);setTimeout(bkNag,700);return r}}
/* ================= マイスターの塔（サイコロ版）からの引き継ぎ =================
 * ・同じブラウザなら自動でサイコロ版のセーブ（okc-save2）を読む。別の端末なら OKS2. のコードかセーブファイルを貼る
 * ・両方にいる仲間：持っていなければ同じ★で仲間に、持っていて★が低ければ★を上げる
 * ・コイン：サイコロ版の所持コインを1:1、上限はガチャ各11連ぶん（11連×ガチャの数）
 * ・1つのセーブで1回だけ（G.flags.inh）。サイコロ版のデータは読むだけで書きかえない */
const DICE_KEY='okc-save2',INH_CAP=GACHA10_COST*GACHA_BANNERS.length;
function diceFromCode(c){c=String(c||'').replace(/\s+/g,'');const i=c.indexOf('OKS2.');if(i<0)throw new Error('head');
 return JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(c.slice(i+5)),x=>x.charCodeAt(0))))}
function diceLocal(){try{const r=localStorage.getItem(DICE_KEY);return r?JSON.parse(r):null}catch(e){return null}}
function diceGift(v){if(!v||typeof v!=='object')return null;const o=v.owned&&typeof v.owned==='object'?v.owned:{};
 const chars=GACHA_POOL.filter(id=>o[id]).map(id=>[id,Math.min(3,Math.max(1,Math.floor(+o[id]||1)))]);
 const coins=Math.min(INH_CAP,Math.max(0,Math.floor(+v.coins||0)));return{chars,coins,raw:Math.max(0,Math.floor(+v.coins||0))}}
function inhApply(d){if(!G||G.flags.inh)return;const got=[];
 d.chars.forEach(([id,st])=>{const m=owned(id);
  if(!m){const nm=newMember(id,1);nm.star=st;nm.shard=0;(G.party.length<PARTY_MAX?G.party:G.bench||(G.bench=[])).push(nm);got.push(`${CHARS[id].name} ★${st}（新しく仲間に）`)}
  else if((m.star||1)<st){m.star=st;got.push(`${CHARS[id].name} ★${st}に`)}});
 G.coin=(G.coin|0)+d.coins;G.flags.inh=1;save();closeSheet();
 $('sheetT').textContent='引き継ぎ完了';
 $('sheetB').innerHTML=`<div class="note" style="line-height:1.8;text-align:center">${UIMG('coin',20)} コイン <b>+${d.coins.toLocaleString()}</b><br>${got.length?got.join('<br>'):'仲間：塔2ですでにそろっていました'}</div><button class="btn gold" id="inhOk">OK</button>`;
 $('inhOk').onclick=()=>{closeSheet();if($('home').classList.contains('on'))openHome()};$('sheet').classList.add('on');tone(880,.2,'triangle',.1,1760)}
function inhAsk(d,from){if(!G){say('先に「はじめる」でゲームを始めてください',1600);return}
 if(G.flags.inh){say('このセーブでは、もう引き継ぎました',1400);return}
 if(!d||(!d.chars.length&&!d.coins)){say('引き継げる仲間・コインがありませんでした',1600);return}
 $('sheetT').textContent='マイスターの塔から引き継ぐ';
 $('sheetB').innerHTML=`<div class="note" style="line-height:1.8">${from}<br>
  <b>仲間</b>：${d.chars.length?d.chars.map(([id,st])=>`${CHARS[id].name}★${st}`).join('、'):'なし'}<br>
  <b>コイン</b>：${d.coins.toLocaleString()}${d.raw>d.coins?`<small>（${d.raw.toLocaleString()}のうち、上限${INH_CAP.toLocaleString()}まで）</small>`:''}<br>
  <span style="font-size:13px;opacity:.8">引き継げるのは1回だけです。サイコロ版のデータはそのまま残ります。</span></div>
  <button class="btn gold" id="inhY">引き継ぐ</button><button class="btn ghost" id="inhN">やめる</button>`;
 $('inhY').onclick=()=>inhApply(d);$('inhN').onclick=closeSheet;$('sheet').classList.add('on')}
function openInherit(){if(!G){say('先に「はじめる」でゲームを始めてください',1600);return}
 if(G.flags.inh){say('このセーブでは、もう引き継ぎました',1400);return}
 const loc=diceLocal();
 $('sheetT').textContent='マイスターの塔から引き継ぐ';
 $('sheetB').innerHTML=`<div class="sg"><div class="note">サイコロ版「マイスターの塔」の仲間とコインを1回だけ受け取れます。両方にいる仲間（ウルフ・キツネなど10人）は同じ★で仲間に。コインは上限${INH_CAP.toLocaleString()}（ガチャ各11連ぶん）。</div>
  ${loc?`<button class="btn gold" id="inhLoc">この端末のデータから引き継ぐ</button>`:'<div class="note">この端末では、サイコロ版のセーブが見つかりませんでした。別の端末で遊んでいたら、サイコロ版の「設定 → コードを書き出す」で出るコードか、セーブのファイルを使ってください。</div>'}
  <textarea id="inhCode" class="sgc" placeholder="OKS2. で始まるサイコロ版のコードを貼り付け" autocomplete="off" autocapitalize="off" spellcheck="false"></textarea>
  <div class="sgr"><button class="btn" id="inhPaste">貼ったコードで引き継ぐ</button><button class="btn" id="inhFile">ファイルから</button></div></div>
  <button class="btn ghost" id="inhX">閉じる</button>`;
 $('inhX').onclick=closeSheet;
 const lb=$('inhLoc');if(lb)lb.onclick=()=>inhAsk(diceGift(loc),'この端末のサイコロ版のセーブ');
 $('inhPaste').onclick=()=>{let v;try{v=diceFromCode($('inhCode').value)}catch(e){say('「OKS2.」で始まるコードを全部貼り付けてください',1800);return}inhAsk(diceGift(v),'貼り付けたコード')};
 $('inhFile').onclick=()=>{const inp=document.createElement('input');inp.type='file';inp.accept='.txt,text/plain';
  inp.onchange=async()=>{const f=inp.files[0];if(!f)return;let v;try{v=diceFromCode(await f.text())}catch(e){say('サイコロ版のセーブファイルではないようです',1600);return}inhAsk(diceGift(v),'ファイル')};inp.click()};
 $('sheet').classList.add('on')}
