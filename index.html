<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>マイスターの魔法陣 RPG（第1章）</title>
<link rel="icon" href="img/title/emblem.webp">
<link rel="apple-touch-icon" href="img/title/icon180.png">
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+1p:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b1024;--panel:#141b38;--line:#2e3a6e;--ink:#f1ecd8;--sub:#9fa8cc;--gold:#e8c35a;--blue:#5aa8ff;--red:#ff5a5a;--green:#4fd07a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'M PLUS 1p',system-ui,sans-serif;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);background:radial-gradient(ellipse at 50% 20%,#1d2a5c 0%,#0b1024 70%)}
button{font:inherit;color:inherit;border:none;cursor:pointer;touch-action:manipulation}
.scr{display:none;min-height:100%;max-width:640px;margin:0 auto;padding:12px}
.scr.on{display:block}
h1,h2{font-family:'Dela Gothic One',sans-serif;font-weight:400}
.btn{display:block;width:100%;padding:14px;margin:8px 0;border-radius:14px;background:linear-gradient(#2c4a9a,#1c2f6a);border:1px solid #5a7ad0;font-weight:800;font-size:17px}
.btn.gold{background:linear-gradient(#d8ae46,#946e1c);border-color:#f3d77a;color:#1b1400}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--sub);font-size:15px}
.btn:disabled{opacity:.4}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px;margin:10px 0}
.note{font-size:13px;color:var(--sub);line-height:1.7}
.hd{display:flex;align-items:center;gap:8px}
.hd h2{margin:0;font-size:20px;flex:1}
.back{background:transparent;border:1px solid var(--line);border-radius:10px;padding:7px 12px;color:var(--sub);min-height:44px}
.nw{white-space:nowrap}
.tag{display:inline-block;font-size:11px;font-weight:800;border-radius:99px;padding:1px 8px;background:#2c4a9a;color:#fff}
/* タイトル */
#title{position:fixed;inset:0;max-width:none;margin:0;padding:calc(env(safe-area-inset-top) + 4vh) 16px calc(env(safe-area-inset-bottom) + 3vh);background:#050f3c url(img/title/title_bg.webp) center/cover no-repeat;display:none;flex-direction:column;align-items:center;text-align:center;z-index:5}
#title.on{display:flex}
#title .tlogo{width:min(92vw,520px);height:auto;filter:drop-shadow(0 4px 14px #000a);pointer-events:none}
#title .tsub{font-weight:800;color:#fff;text-shadow:0 2px 6px #000,0 0 12px #000a;margin-top:2px;font-size:clamp(13px,3.6vw,16px)}
#title .tbtns{margin-top:auto;width:100%;max-width:380px}
#title .tbtns .btn.ghost{background:#0b1024cc}
#title .tbtns #btnReset{margin-top:22px;font-size:13px;padding:10px;width:auto;display:inline-block;min-width:160px;min-height:44px}
#title .tver{font-size:12px;font-weight:700;color:#dfe6ff;text-shadow:0 1px 4px #000;margin-top:6px}
#title .tnote{font-size:12px;color:#ffd9a0;text-shadow:0 1px 4px #000;margin-top:4px}
/* 横向きの案内（横向きのレイアウトは作らない） */
#rotate{display:none;position:fixed;inset:0;z-index:50;background:#0b1024;color:var(--ink);flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;font-weight:800;font-size:20px;line-height:1.7}
#rotate .rph{display:block;width:34px;height:56px;border:3px solid var(--gold);border-radius:8px;margin:0 auto 14px;box-shadow:inset 0 -8px 0 -5px var(--gold)}
@media (min-aspect-ratio:1/1) and (max-height:499px){#rotate{display:flex}}
/* 主役選び */
.cgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.cgrid.one{grid-template-columns:minmax(0,min(60%,260px));justify-content:center}
.cc{background:#0e1430;border:2px solid var(--line);border-radius:16px;padding:8px;text-align:center}
.cc img{width:100%;aspect-ratio:1/1;object-fit:contain}
.cc .nm{font-weight:800}
.cc.sel{border-color:var(--gold);box-shadow:0 0 16px #e8c35a66}
/* マップ */
#mapStat,#mapStat2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;padding-bottom:4px}
#mapStat .mini,#mapStat2 .mini{min-width:0;padding:3px 6px}#mapStat .mini img,#mapStat2 .mini img{width:32px;height:32px}
.mini{flex:none;display:flex;gap:6px;align-items:center;background:#0e1430;border:1px solid var(--line);border-radius:12px;padding:4px 8px;min-width:150px}
.mini img{width:38px;height:38px;object-fit:contain}
.mini .t{font-size:12px;font-weight:800;line-height:1.3;flex:1}
.hb{height:6px;border-radius:9px;background:#060a1a;overflow:hidden;margin-top:2px}.hb i{display:block;height:100%;background:var(--green)}
.mb i{background:var(--blue)}.sb i{background:var(--gold)}
#mapWrap{position:relative;margin:10px auto}
#mapWrap svg{position:absolute;inset:0;pointer-events:none}
.node{position:absolute;width:86px;margin-left:-43px;margin-top:-30px;border-radius:14px;background:#16204a;border:2px solid #3a4a8a;padding:5px 2px;text-align:center;font-size:11px;font-weight:800;line-height:1.2}
.node .i{font-size:22px;display:block;line-height:1}
.node .i .ic{display:block;margin:0 auto 2px}
.ic{vertical-align:middle;object-fit:contain;display:inline-block}
.node.done{border-color:#6fbf6a;background:#1c3020}
.node.av{border-color:var(--gold);animation:pul 1.2s infinite}
.node.lock{opacity:.35}
.node.boss{border-color:#c04848}
.node.used{opacity:.55;filter:grayscale(.8);border-style:dashed}
#map.busy #mapWrap,#map.busy .mbar{pointer-events:none}
@keyframes pul{0%,100%{box-shadow:0 0 0 0 #e8c35a88}50%{box-shadow:0 0 0 7px #e8c35a00}}
.mbar{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.mbar .btn{font-size:13px;padding:10px 2px}
/* バトル */
/* 戦闘の背景はノッチ・ホームバーの帯まで広げる（中身は env() の分だけ内側） */
#battle{display:none;flex-direction:column;position:relative;padding:8px;background-size:cover;background-position:center top;background-color:#0b1024;
 margin-top:calc(-1 * env(safe-area-inset-top));margin-bottom:calc(-1 * env(safe-area-inset-bottom));height:calc(100% + env(safe-area-inset-top) + env(safe-area-inset-bottom));
 padding-top:calc(8px + env(safe-area-inset-top));padding-bottom:calc(8px + env(safe-area-inset-bottom))}
#cmd.wait .cb:not(.tool),#cmd.wait .sk{opacity:.45;pointer-events:none}
#cmd .cgrid2{grid-template-columns:repeat(4,1fr)}
#cmd .cb{font-size:14px;padding:10px 2px;min-height:44px}
#cmd .cb.tool{font-size:12px;background:#121a3a}
#cmd .cb.tool.on{background:#2f6a3a;border-color:var(--green)}
#cmd #bSpd.on{background:#3a5aaa;border-color:var(--gold)}
.foe.in{animation:fin .25s ease-out}
@keyframes fin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

#battle.on{display:flex}
#foes{flex:1;display:flex;align-items:center;justify-content:center;gap:4px;min-height:150px;position:relative}
.foe{display:flex;flex-direction:column;align-items:center;position:relative;transition:transform .1s}
.foe svg{width:min(28vw,130px);height:min(28vw,130px)}
.foe.boss svg{width:min(48vw,220px);height:min(48vw,220px)}
.foe .fimg{width:min(28vw,130px);height:min(28vw,130px);object-fit:contain;filter:drop-shadow(0 6px 10px #000a);-webkit-user-drag:none}
.foe.boss .fimg{width:min(62vw,260px);height:min(62vw,260px)}
.foe.tg .fimg{filter:drop-shadow(0 0 12px #e8c35a)}
.foe.hit .fimg{filter:drop-shadow(0 0 14px #ff5a5a) brightness(1.4)}
.foe .fn{font-size:12px;font-weight:800;white-space:nowrap}
.foe .st{font-size:11px;min-height:1.4em;line-height:1.4em;white-space:nowrap;max-width:min(28vw,120px);overflow:hidden;text-overflow:ellipsis}
.foe.boss .st{max-width:min(62vw,240px)}
.foe .hb{width:80px}
.foe.tg{cursor:pointer}.foe.tg svg{filter:drop-shadow(0 0 10px #e8c35a)}
.foe.dead{opacity:0;transform:scale(.6);transition:.5s}
.foe.hit{transform:translateX(6px)}
.st{font-size:10px;color:var(--gold);min-height:13px}
#log{background:#060a1aee;border:1px solid var(--line);border-radius:12px;padding:8px 10px;font-size:14px;line-height:1.6;height:calc(1.6em * 3 + 18px);box-sizing:border-box;overflow:hidden;font-weight:700;display:flex;flex-direction:column;justify-content:flex-end}
#log>div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:none}
#log>div:last-child{white-space:normal}  /* 最新の1行だけは折り返す（古い行は上へ押し出される） */
#log div:last-child{color:#fff}#log div{color:var(--sub)}
#bparty{display:grid;gap:6px;margin-top:6px}
.pm{background:#141b38;border:2px solid var(--line);border-radius:12px;padding:5px;position:relative;display:flex;gap:6px;align-items:center;min-height:58px;min-width:0;overflow:hidden}
.pm .t{min-width:0;flex:1}
/* ギアフォックスの三面図ミッション */
.cqstep{font-weight:800;color:var(--gold);font-size:14px;white-space:nowrap}
.cqmsg{display:flex;gap:8px;align-items:center;background:#141b38;border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin:8px 0;font-size:14px;line-height:1.6}
.cqmsg img{width:44px;height:44px;object-fit:cover;object-position:50% 0;border-radius:10px;background:#0b1024;flex:none}
#cqViews{display:block;width:100%;border-radius:12px}
.cqcands{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.cqcands .cand{position:relative;background:#141b38;border:2px solid var(--line);border-radius:12px;padding:4px 4px 6px;min-height:44px}
.cqcands .cand b{position:absolute;left:8px;top:4px;font-size:16px;color:var(--gold)}
.cqcands .cand canvas{display:block;width:100%;height:auto;touch-action:none;cursor:grab}
.cqrow{display:flex;gap:6px;margin-top:4px}
.cqrow button{min-height:44px;border-radius:10px;font-weight:800;border:1px solid #5a7ad0;background:linear-gradient(#2c4a9a,#1c2f6a)}
.cqrow .cqrs{width:44px;flex:none;font-size:18px}.cqrow .cqpick{flex:1;font-size:15px}.cqrow .cqpick:disabled{opacity:.45}
.cqcands .cand.ok{border-color:var(--green);background:#16351f}.cqcands .cand.ng{border-color:var(--red);background:#3a1620}
#cqFb{min-height:72px;margin-top:8px;font-size:14px;line-height:1.6;text-align:center}
#cqFb .okc{color:var(--green);font-weight:800;font-size:18px}#cqFb .ngc{color:var(--red);font-weight:800;font-size:16px}
.pm img{width:42px;height:42px;object-fit:contain}
.pm .t{flex:1;min-width:0;font-size:11px;font-weight:800;line-height:1.25}
.pm .pnm{display:flex;gap:4px;white-space:nowrap;min-width:0}
.pm .pnm>span{min-width:0;overflow:hidden;text-overflow:ellipsis}
.pm .pnm .pnmT{flex:0 1 auto}.pm .pnm .pst{flex:0 1 auto}
.pm.act{border-color:var(--gold);box-shadow:0 0 10px #e8c35a77}
.pm.ko{opacity:.4;filter:grayscale(1)}
.pm.tg{border-color:var(--green);box-shadow:0 0 10px #4fd07a}
.pm.hit{animation:sh .35s}
@keyframes sh{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
/* コマンド欄は高さ固定。わざ・どうぐの一覧は欄の下端から上へ重ねて出す（敵・ログ・パーティが動かない） */
#cmd{margin-top:6px;height:150px;flex:none;position:relative}
#cmd.over>.cmdBox{position:absolute;left:0;right:0;bottom:0;max-height:calc(100vh - 150px);overflow-y:auto;background:#0b1024f5;border:1px solid var(--line);border-radius:12px;padding:6px;z-index:4;box-shadow:0 -6px 18px #000a}
#cmd .sk{min-height:44px}
#bk{min-height:44px}
.cmdT{font-weight:800;font-size:14px;margin-bottom:4px;display:flex;justify-content:space-between}
.cgrid2{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.cb{padding:11px 4px;border-radius:12px;background:#1c2a5c;border:1px solid #4a63b8;font-weight:800;font-size:15px}
.cb.sp{background:linear-gradient(#a07a20,#5a420c);border-color:var(--gold)}
.cb:disabled{opacity:.35}
.cb small{display:block;font-size:10px;color:var(--sub);font-weight:700}
.pop{position:absolute;font-family:'Dela Gothic One','M PLUS 1p',system-ui,sans-serif;font-size:26px;color:#fff;text-shadow:0 0 8px #ff4040,0 2px 0 #000;animation:pop .9s forwards;pointer-events:none;z-index:3}
.pop.h{color:#9fe08a;text-shadow:0 0 8px #2a8a3a,0 2px 0 #000}
.pop.c{color:var(--gold);font-size:32px}
@keyframes pop{0%{transform:translateY(0) scale(.6);opacity:0}20%{transform:translateY(-8px) scale(1.15);opacity:1}100%{transform:translateY(-40px);opacity:0}}
/* なぞり・加工（共通） */
#craft{display:none;flex-direction:column;height:100%;padding:10px}
#craft.on{display:flex}
#craftT{font-weight:800;font-size:17px;text-align:center;color:var(--gold)}
#craftSub{font-size:13px;color:var(--sub);text-align:center;min-height:20px}
#stage{position:relative;flex:1;display:flex;align-items:center;justify-content:center;min-height:0;margin:6px 0}
#cv{touch-action:none;display:block}
#cv.round{border-radius:50%}
#cv.box{border-radius:14px;border:1px solid var(--line)}
#hud{position:absolute;top:2px;left:0;right:0;display:flex;justify-content:space-between;font-weight:800;font-size:14px;pointer-events:none;padding:0 6px}
#tbar{height:8px;border-radius:99px;background:#060a1a;overflow:hidden;margin:0 8%}
#tbar>i{display:block;height:100%;background:linear-gradient(90deg,#ff7a5a,#e8c35a)}
/* 町 */
#town{display:none;flex-direction:column;height:100%;padding:6px 8px}
#town.on{display:flex}
#townTop{display:flex;gap:6px;align-items:center}
#townTop .ttl{font-weight:800;font-size:15px;color:var(--gold);flex:1}
#townTop button{background:#141b38;border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-weight:800;font-size:13px}
#townTop .tbtn{padding:6px 7px;line-height:0;min-width:44px;min-height:44px}
#tWrap{flex:1;position:relative;min-height:0;margin:6px 0 0;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#0a0e1e}
#tcv{position:absolute;inset:0;touch-action:none;display:block}
/* どこでも出る半透明のスティック（触った場所に出て、指をずらした方向へ歩く） */
#tWrap{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#stick{position:absolute;width:112px;height:112px;margin:-56px 0 0 -56px;border-radius:50%;background:radial-gradient(#ffffff14,#ffffff26 68%,#ffffff40 70%,transparent 72%);border:2px solid #ffffff55;pointer-events:none;display:none;z-index:2}
#stick.on{display:block}
#stick i{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;background:#e8c35a66;border:2px solid #ffe7a0aa;box-shadow:0 0 12px #e8c35a55}
#tHint{position:absolute;left:0;right:0;top:0;padding:5px 10px;font-size:11px;color:#dfe6ff;background:linear-gradient(#0a0e1ecc,transparent);pointer-events:none;transition:opacity 1s}
#tHint.off{opacity:0}
/* 会話 */
.ov{position:fixed;inset:0;background:#000b;display:none;align-items:flex-end;justify-content:center;z-index:10;padding:12px 12px calc(12px + env(safe-area-inset-bottom))}
body.talking #stick{display:none}
.ov.on{display:flex}
#sheet{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;justify-content:center;z-index:9;padding:12px 12px calc(12px + env(safe-area-inset-bottom))}
#sheet.on{display:flex}
#sheet .shp{width:100%;max-width:520px;background:#141b38;border:2px solid var(--gold);border-radius:18px;padding:12px 14px 14px;animation:shup .18s ease-out}
@keyframes shup{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
#sheet .shh{display:flex;align-items:center;justify-content:space-between;font-weight:800;font-size:18px;color:var(--gold);margin-bottom:8px}
#sheet .shh span{display:flex;align-items:center;gap:6px}
#sheet .shh button{background:#0b1024;border:1px solid var(--line);border-radius:10px;width:44px;height:44px;font-size:18px;color:var(--ink)}
.itr{display:flex;align-items:center;gap:10px;background:#0b1024;border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin-top:6px}
.itr .itn{flex:1;min-width:0;display:flex;flex-direction:column}
.itr .itn b{font-size:16px}.itr .itn small{font-size:12px;color:var(--sub)}
.sk.itb{display:flex;align-items:center;gap:10px;text-align:left}
.sk.itb .itn{flex:1;display:flex;flex-direction:column}.sk.itb .itn small{font-size:11px;color:var(--sub)}
.itc{font-weight:800;font-size:18px;color:var(--gold);min-width:44px;text-align:right}.itc.z{color:var(--sub);opacity:.6}
#talk.ev{background:#000 center top/cover no-repeat}
#talk .box{width:100%;max-width:600px;height:196px;box-sizing:border-box;background:#141b38f5;border:2px solid var(--gold);border-radius:16px;padding:14px;display:flex;gap:12px;align-items:flex-start;margin-bottom:6vh}
#talk .box>div:last-child{display:flex;flex-direction:column;height:100%;min-width:0}
#talk .tface{width:96px;height:104px;flex:none;overflow:hidden;border-radius:10px;background:#0b1024}
#talk .tface img{display:block;width:180%;margin-left:-40%;margin-top:-4%;max-width:none}
#talk .who{font-weight:800;color:var(--gold);margin-bottom:4px;min-height:1.4em;flex:none}
#talk .who:empty{display:none}
#talk .txt{font-size:15px;line-height:1.7;white-space:pre-wrap;flex:1;overflow-y:auto;min-height:0}
#talk .nx{text-align:right;font-size:12px;color:var(--sub);margin-top:2px;flex:none}
#msg{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;text-align:center;z-index:8}
#msg>div{background:#0b1024f2;border:1px solid var(--gold);border-radius:16px;padding:14px 20px;font-weight:800;font-size:18px;line-height:1.6;max-width:86%;opacity:0;transform:scale(.9);transition:.2s}
#msg.on>div{opacity:1;transform:scale(1)}
.big{font-family:'Dela Gothic One','M PLUS 1p',system-ui,sans-serif;font-size:30px;color:var(--gold)}
#resBtns{position:sticky;bottom:0;padding:4px 0 calc(4px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 30%)}
#resP .endImg{width:100%;max-width:360px;max-height:45vh;aspect-ratio:1/1.05;object-fit:cover;object-position:top;border-radius:12px;display:block;margin:0 auto 6px}
.flash{position:fixed;inset:0;pointer-events:none;box-shadow:inset 0 0 60px #ff3030;opacity:0;transition:opacity .15s;z-index:5}.flash.on{opacity:.8}
/* パーティ詳細 */
.mem{display:flex;gap:10px;align-items:flex-start}
.mem img{width:96px;height:96px;object-fit:contain}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;font-size:13px;font-weight:800;margin:6px 0}
.stats div{background:#0e1430;border-radius:8px;padding:4px 6px;display:flex;align-items:center;line-height:1.4}
.sk{display:flex;justify-content:space-between;gap:6px;align-items:center;padding:8px;border-radius:10px;background:#0e1430;border:2px solid var(--line);margin:4px 0;font-size:13px;width:100%;text-align:left;min-height:44px}
.sk.on{border-color:var(--gold)}
.sk small{color:var(--sub)}
.new{display:inline-block;font-size:10px;font-weight:800;border-radius:99px;padding:0 6px;background:var(--red);color:#fff;margin-left:4px}
</style>
</head>
<body>

<section id="title" class="scr on">
 <img class="tlogo" src="img/title/logo.webp" alt="マイスターの魔法陣">
 <div class="tsub">RPG　第1章「夜の工房に灯る」</div>
 <div class="tver" id="tVer"></div>
 <div class="tnote" id="tNote"></div>
 <div class="tbtns">
  <button class="btn gold" id="btnStart" onclick="goStart()">はじめる</button>
  <button class="btn ghost" id="btnReset" onclick="askReset()">セーブを消す</button>
 </div>
</section>

<section id="pick" class="scr">
 <div class="hd"><h2>主人公</h2></div>

/* ボスの行動（foeAct から BOSS_AI[f.ai](f) を呼ぶ。返り値＝使う技のID）
   共通ルール：
   - f.bp は行動の回数（1から数える）。f.charge に「ため」の次に出す技IDを入れておく
   - kind:'charge' の技を返したターンは攻撃しない（予告）。次の行動で f.charge の技を必ず出す
   - kind:'phase' の技を返したら、foeAct 側で「変身」処理（下の rostol を参照）を行う */
const BOSS_AI={
 /* 路地裏：錆の番人（旧来の動きと同じ）。4回に1回ため→次に錆鉄槌（単体・大） */
 boss(f){f.bp++;
  if(f.charge){const s=f.charge;f.charge=false;return s}
  if(f.bp%4===0){f.charge='e_smash';return 'e_charge'}
  const r=Math.random();return r<.35?'e_wave':r<.675?'e_rust':'e_atk'},
 /* 廃工場：錆クレーン ギギガント。4行動で1周［通常→通常→フック巻き上げ（予告）→フック大旋回（全体・大）］
    HPが40%以下になると3行動で1周［通常→フック巻き上げ→フック大旋回］に早まる */
 crane(f){f.bp++;
  if(f.charge){const s=f.charge;f.charge=false;f.cyc=0;return s}
  f.cyc=(f.cyc||0)+1;const len=f.hp<=f.max*.4?2:3;
  if(f.cyc>=len){f.charge='e_press';return 'e_lift'}
  return Math.random()<.5?'e_belt':'e_steam'},
 /* 地下工房：錆炉王ロストール（2段階）
    第1段階（HP50%超）：4行動で1周［薙ぎ払い/錆の息→こうげき/錆の息→ため（予告）→炉王の鉄槌（単体・特大）］
    HPが50%以下になった次の行動で「変身」（攻撃しない。自分の弱体・しびれを消す。f.ph=2）
    第2段階：3行動で1周［錆の波動/図面の呪い→錆を集める（予告）→錆炎の嵐（全体・大）］ */
 rostol(f){f.bp++;
  if(f.charge){const s=f.charge;f.charge=false;f.cyc=0;return s}
  if(!f.ph&&f.hp<=f.max*.5){f.ph=2;f.cyc=0;return 'e_crown'}
  f.cyc=(f.cyc||0)+1;
  if(f.ph===2){if(f.cyc>=2){f.charge='e_storm';return 'e_gather'}return Math.random()<.6?'e_wave':'e_curse'}
  if(f.cyc>=3){f.charge='e_crush';return 'e_charge'}
  return f.cyc===1?(Math.random()<.6?'e_sweep':'e_rust'):(Math.random()<.6?'e_atk':'e_rust')}
};

 const scr=([x,y],ox=0,oy=0)=>[(x-camX+ox)*TS,(y-camY+oy)*TS],vis=(X,Y,m=1)=>X>-TS*m&&Y>-TS*m&&X<W+TS*(m-1)&&Y<H+TS*(m-1);
 c2.fillStyle='#0a0e1e';c2.fillRect(0,0,W+2,H+2);
 const bg=townBG();
 if(bg){const sw=bg.naturalWidth/cols,sh=bg.naturalHeight/rows;c2.drawImage(bg,camX*sw,camY*sh,VW*sw,VH*sh,0,0,W,H);
  /* 絵の上に重ねる動き：開けた宝箱・門の渦 */
  TOWN_SPOTS.T.forEach(p=>{if(!G.opened.includes(p[0]+','+p[1]))return;const[X,Y]=scr(p);if(vis(X,Y))openedMark(c2,X,Y,TS)});
  TOWN_SPOTS.R.forEach(p=>{const[X,Y]=scr(p);if(!vis(X,Y,2))return;c2.save();c2.globalAlpha=.25+Math.sin(TW.t*3)*.12;const g=c2.createRadialGradient(X+TS/2,Y+TS/2,0,X+TS/2,Y+TS/2,TS*.7);g.addColorStop(0,'#d8b8ff');g.addColorStop(1,'rgba(180,140,255,0)');c2.fillStyle=g;c2.fillRect(X-TS,Y-TS,TS*3,TS*3);c2.restore()})}
 else if(townBGfailed()){const sx=Math.floor(camX),sy=Math.floor(camY);
  for(let y=sy;y<=Math.min(rows-1,Math.ceil(sy+VH));y++)for(let x=sx;x<=Math.min(cols-1,Math.ceil(sx+VW));x++){const t=tileAt(x,y),X=(x-camX)*TS,Y=(y-camY)*TS;drawTile(c2,t,X,Y,TS,x,y)}}
 /* 夜の暗さと灯り */
 const X=(TW.fx-camX)*TS,Y=(TW.fy-camY)*TS;
 const dk=TW.dark,d=Math.min(2,devicePixelRatio||1),dw=Math.ceil(W*d),dh=Math.ceil(H*d);if(dk.width!==dw||dk.height!==dh){dk.width=dw;dk.height=dh}const g=dk.getContext('2d');g.setTransform(d,0,0,d,0,0);g.globalCompositeOperation='source-over';g.clearRect(0,0,W,H);g.fillStyle='rgba(4,6,20,.5)';g.fillRect(0,0,W,H);g.globalCompositeOperation='destination-out';
 const glow=(gx,gy,r)=>{if(gx<-r||gy<-r||gx>W+r||gy>H+r)return;const gr=g.createRadialGradient(gx,gy,0,gx,gy,r);gr.addColorStop(0,'rgba(0,0,0,1)');gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;g.beginPath();g.arc(gx,gy,r,0,TAU);g.fill()};
 glow(X+TS/2,Y+TS/2,TS*3.2);
 TOWN_SPOTS.L.forEach(([x,y])=>glow((x-camX+.5)*TS,(y-camY+.3)*TS,TS*(2.6+Math.sin(TW.t*3+x)*.1)));
 TOWN_SPOTS.W.concat(TOWN_SPOTS.R).forEach(([x,y])=>glow((x-camX+.5)*TS,(y-camY+.3)*TS,TS*2));
 c2.drawImage(dk,0,0,W,H);
 /* 灯りの色 */
 TOWN_SPOTS.L.forEach(([x,y])=>{const gx=(x-camX+.5)*TS,gy=(y-camY+.2)*TS;if(!vis(gx,gy,3))return;const gr=c2.createRadialGradient(gx,gy,0,gx,gy,TS*2.2);gr.addColorStop(0,'rgba(255,200,110,.22)');gr.addColorStop(1,'rgba(255,200,110,0)');c2.fillStyle=gr;c2.fillRect(gx-TS*2.2,gy-TS*2.2,TS*4.4,TS*4.4)});
 /* キャラは暗さの上に描く（夜でも見えるように）。y で並べ、手前のキャラを上に重ねる */
 const list=[];
 townPeople().forEach(n=>{const[NX,NY]=scr([n.x,n.y]);if(!vis(NX,NY,2))return;
  list.push({y:n.y,f:()=>{if(!walker(c2,n.id,NX,NY,TS,TW.npcFace[n.id]||[0,1],false,n.x))sprite(c2,`img/${n.id}.webp`,NX,NY,TS,Math.sin(TW.t*2+n.x)*1.5,'#9fb4d6')}})});
 townFollowers().forEach(fw=>{const[FX,FY]=scr([fw.x,fw.y]);if(!vis(FX,FY,2))return;
  list.push({y:fw.y,f:()=>{if(!walker(c2,fw.id,FX,FY,TS,fw.face,fw.mv,fw.i))sprite(c2,CHARS[fw.id].img,FX,FY,TS,fw.mv?Math.abs(Math.sin(TW.t*14+fw.i))*-4:0,'#4fd07a')}})});
 list.push({y:TW.fy+.01,f:()=>{if(!walker(c2,G.hero,X,Y,TS,TW.face,TW.moving,0))sprite(c2,CHARS[G.hero].img,X,Y,TS,TW.moving?Math.abs(Math.sin(TW.t*14))*-4:0,'#e8c35a')}});

function townTap(e){if(!TW||TW.busy||!TW.hits)return;const r=$('tcv').getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top,TS=TW.TS;
 const h=TW.hits.find(o=>x>=o.X+TS*.1&&x<=o.X+TS*.9&&y>=o.Y-TS*.3&&y<=o.Y+TS*.95);if(!h)return;
 e.preventDefault();TW.dir=null;releaseDpad();
 if(h.party&&CADQ_MISSION[h.id]){cadMenu(h.id);return}
 if(h.party){const L=PARTY_TOWN_TALK[h.id];interact(()=>talk(L&&L.length?pick(L):[[h.id,CHARS[h.id].name,'……']]));return}
 const n=h.n;TW.npcFace[n.id]=[Math.sign(TW.px-n.x),Math.sign(TW.py-n.y)];interact(()=>talk(n.party?pick(PARTY_TOWN_TALK[n.id]||[[[n.id,CHARS[n.id].name,'……']]]):npcLines(n)))}

/* 隊列：仲間 i（1〜3）は主人公の i 歩前のマスにいて、主人公と同じ進み具合で次のマスへ動く（ドラクエ式） */
function townFollowers(){const fs=G.party.filter(m=>m.id!==G.hero).slice(0,3);if(!fs.length)return[];
 const hero=[TW.px,TW.py],tr=TW.trail,p=TW.moving?clamp(1-(Math.abs(TW.px-TW.fx)+Math.abs(TW.py-TW.fy)),0,1):1;
 const at=k=>k<=0?hero:(tr[k-1]||(tr.length?tr[tr.length-1]:hero));  /* 足あとが足りないときは最後の足あと（なければ主人公）に重ねる */
 return fs.map((m,j)=>{const i=j+1,to=at(i),from=at(i+1),dx=to[0]-from[0],dy=to[1]-from[1],mv=TW.moving&&(dx||dy);
  if(dx||dy)TW.ffaces[j]=[Math.sign(dx),Math.sign(dy)];
  return{id:m.id,i,x:from[0]+dx*p,y:from[1]+dy*p,face:TW.ffaces[j]||TW.face||[0,1],mv}})}
/* 歩くキャラ（img/walk/キャラID_向き.webp）。画像があるキャラだけ使い、なければ丸い立ち絵 */
/* takumi は画像だけ用意（まだ CHARS・NPCS にいない） */
const WALKERS=['wolf','fox','owl','dodo','gorilla','mouse','robot','tsukiyo','onmyo','rocker','takumi'];
WALKERS.forEach(id=>['down','left','right','up'].forEach(d=>img(`img/walk/${id}_${d}.webp`)));
/* face=[dx,dy] の向き、mv=歩いているか、seed=キャラごとに揺れをずらす数 */
function walker(c,id,X,Y,TS,face,mv,seed=0){if(!WALKERS.includes(id))return false;const[fx,fy]=face||[0,1];const d=fx<0?'left':fx>0?'right':fy<0?'up':'down';
 const im=img(`img/walk/${id}_${d}.webp`);if(!(im.complete&&im.naturalWidth))return false;
 const ph=TW.t*14+seed*.7,bob=mv?-Math.abs(Math.sin(ph))*TS*.08:Math.sin(TW.t*2+seed)*TS*.01,tilt=mv&&fx?Math.sin(ph)*.06:0,S=TS*1.3;
 c.save();c.fillStyle='rgba(0,0,0,.4)';c.beginPath();c.ellipse(X+TS/2,Y+TS*.92,TS*.3,TS*.1,0,0,TAU);c.fill();
 c.translate(X+TS/2,Y+TS*.95+bob);c.rotate(tilt);c.drawImage(im,-S/2,-S,S,S);c.restore();return true}
function sprite(c,src,X,Y,TS,bob,col){const im=img(src);c.save();c.fillStyle='rgba(0,0,0,.35)';c.beginPath();c.ellipse(X+TS/2,Y+TS*.9,TS*.32,TS*.1,0,0,TAU);c.fill();

/* 町のタイル画像（img/tile/）。地面は数マスにまたがる1枚の絵として切り出し、物はマス1つに1枚。読み込み前は drawTileOld で描く */
const TILE_DIR='img/tile/';
/* 町の1枚絵（img/town/town.webp）。あればタイルの代わりに使う。町のマス目（TOWN）の範囲全体に引きのばして描く */
const TOWN_BG_SRC='img/town/town.webp';let townBGimg=null;
function townBG(){if(!townBGimg){townBGimg=new Image();townBGimg.onerror=()=>{townBGimg.failed=true};townBGimg.src=TOWN_BG_SRC}return !townBGimg.failed&&townBGimg.complete&&townBGimg.naturalWidth?townBGimg:null}
const townBGfailed=()=>townBGimg&&townBGimg.failed;
townBG();  /* ページを開いた時点で読み込みを始める */
function tImg(n){const i=img(TILE_DIR+n+'.webp');return i.complete&&i.naturalWidth?i:null}
/* 画像 n を n×n マスに引きのばし、そのうち (u,v) のマス分を描く */
function tPart(c,name,X,Y,TS,u,v,n){const i=tImg(name);if(!i)return false;const w=i.naturalWidth/n,h=i.naturalHeight/n;c.drawImage(i,(((u%n)+n)%n)*w,(((v%n)+n)%n)*h,w,h,X,Y,TS+.5,TS+.5);return true}
function tWhole(c,name,X,Y,TS){const i=tImg(name);if(!i)return false;c.drawImage(i,X,Y,TS+.5,TS+.5);return true}
function drawTile(c,t,X,Y,TS,x,y){
 let ok=false;
 switch(t){
  case '.':case 'S':ok=tPart(c,'road',X,Y,TS,x,y,4);break;
  case ',':ok=tPart(c,'grass',X,Y,TS,x,y,3);break;
  case '~':ok=tPart(c,'water',X,Y,TS,x,y,3);if(ok){c.fillStyle=`rgba(120,180,255,${.06+Math.sin(TW.t*1.6+x*.7+y)*.05})`;c.fillRect(X,Y,TS,TS)}break;
  case '#':ok=tPart(c,'wall',X,Y,TS,x,y,3);break;
  case 'P':ok=tPart(c,'wall',X,Y,TS,x-18,y-5,2);break;
  case 'B':ok=tPart(c,'workshop',X,Y,TS,x-10,y-1,4);break;
  case 'W':ok=tWhole(c,'door',X,Y,TS);break;
  case 'L':ok=tWhole(c,'lamp',X,Y,TS);break;
  case 'F':ok=tWhole(c,'fence',X,Y,TS);break;
  case 'T':ok=tWhole(c,'chest',X,Y,TS);if(ok&&G.opened.includes(x+','+y))openedMark(c,X,Y,TS);break;
  case 'R':ok=tWhole(c,'gate',X,Y,TS);if(ok){c.save();c.globalAlpha=.35+Math.sin(TW.t*3)*.15;c.fillStyle='#b48cff';c.beginPath();c.arc(X+TS/2,Y+TS*.5,TS*.18,0,TAU);c.fill();c.restore()}break;
 }
 if(!ok){drawTileOld(c,t,X,Y,TS,x,y);return}
 if(t==='S'){c.fillStyle='#6a4a2a';c.fillRect(X+TS*.46,Y+TS*.45,TS*.08,TS*.45);c.fillStyle='#c9a06a';c.fillRect(X+TS*.18,Y+TS*.2,TS*.64,TS*.32);c.fillStyle='#3a2a1a';c.font=`800 ${TS*.2}px sans-serif`;c.textAlign='center';c.fillText('看板',X+TS/2,Y+TS*.42)}}
/* タイル画像は町の1枚絵が読めなかったときだけ使うので、先読みはしない */
function drawTileOld(c,t,X,Y,TS,x,y){
 const road=()=>{c.fillStyle=(x+y)%2?'#232a48':'#262e4e';c.fillRect(X,Y,TS,TS);c.strokeStyle='rgba(255,255,255,.04)';c.strokeRect(X+.5,Y+.5,TS-1,TS-1)};
 switch(t){
  case '.':road();break;
  case ',':c.fillStyle='#1e3a2c';c.fillRect(X,Y,TS,TS);c.fillStyle='#2e5a3e';for(let i=0;i<3;i++){c.fillRect(X+((x*7+i*11)%TS),Y+((y*5+i*13)%TS),2,5)}break;

  case '#':c.fillStyle='#2a2440';c.fillRect(X,Y,TS,TS);c.fillStyle='#352e52';c.fillRect(X,Y,TS,TS*.35);c.strokeStyle='#1a1630';c.strokeRect(X+.5,Y+.5,TS-1,TS-1);if((x+y)%3===0){c.fillStyle='rgba(255,210,120,.25)';c.fillRect(X+TS*.3,Y+TS*.5,TS*.18,TS*.22)}break;
  case 'B':c.fillStyle='#4a2e1c';c.fillRect(X,Y,TS,TS);c.fillStyle='#6a3e22';c.fillRect(X,Y,TS,TS*.3);c.strokeStyle='#2a180c';c.strokeRect(X+.5,Y+.5,TS-1,TS-1);if(y===1){c.fillStyle='#e8c35a';c.font=`${TS*.5}px sans-serif`;c.textAlign='center';if(x===11)c.fillText('🔨',X+TS/2,Y+TS*.7)}break;
  case 'W':c.fillStyle='#4a2e1c';c.fillRect(X,Y,TS,TS);c.fillStyle='#ffb85a';c.fillRect(X+TS*.22,Y+TS*.2,TS*.56,TS*.8);c.fillStyle='#7a4a1a';c.fillRect(X+TS*.62,Y+TS*.6,TS*.06,TS*.06);break;
  case 'R':road();c.save();c.translate(X+TS/2,Y+TS/2);c.rotate(TW.t*2);c.strokeStyle='#b48cff';c.lineWidth=3;c.beginPath();for(let a=0;a<12;a+=.3){const r=a*TS*.035;c.lineTo(Math.cos(a)*r,Math.sin(a)*r)}c.stroke();c.restore();break;
  case 'T':road();c.fillStyle=G.opened.includes(x+','+y)?'#5a4a30':'#b07a2a';c.fillRect(X+TS*.18,Y+TS*.32,TS*.64,TS*.5);c.fillStyle='#e8c35a';c.fillRect(X+TS*.18,Y+TS*.48,TS*.64,TS*.06);c.fillRect(X+TS*.46,Y+TS*.44,TS*.08,TS*.14);break;
  case 'L':road();c.fillStyle='#55618a';c.fillRect(X+TS*.46,Y+TS*.25,TS*.08,TS*.65);c.fillStyle='#ffe0a0';c.beginPath();c.arc(X+TS/2,Y+TS*.22,TS*.12,0,TAU);c.fill();break;
  case 'F':road();c.strokeStyle='#6a7290';c.lineWidth=2;for(let i=0;i<3;i++){c.beginPath();c.moveTo(X+TS*(.2+i*.3),Y+TS*.3);c.lineTo(X+TS*(.2+i*.3),Y+TS*.9);c.stroke()}c.beginPath();c.moveTo(X,Y+TS*.45);c.lineTo(X+TS,Y+TS*.45);c.stroke();break;
  case 'S':road();c.fillStyle='#6a4a2a';c.fillRect(X+TS*.46,Y+TS*.45,TS*.08,TS*.45);c.fillStyle='#c9a06a';c.fillRect(X+TS*.18,Y+TS*.2,TS*.64,TS*.32);c.fillStyle='#3a2a1a';c.font=`800 ${TS*.2}px sans-serif`;c.textAlign='center';c.fillText('看板',X+TS/2,Y+TS*.42);break;

  default:road()}}
/* 入力：どこでもスティック・矢印キー */
const STK={id:null,x:0,y:0,t:0,moved:false,R:44,DEAD:12};

/* 町：マップのどこを触ってもスティックが出る。指をずらすと4方向に歩き、離すと止まる。動かさずに離したら「タップ」＝人やキャラに話しかける */
(()=>{const W=$('tWrap'),st=$('stick'),kn=st.firstElementChild;
 W.addEventListener('pointerdown',e=>{if(!$('town').classList.contains('on')||STK.id!==null)return;e.preventDefault();audio();
  const r=W.getBoundingClientRect();Object.assign(STK,{id:e.pointerId,x:e.clientX,y:e.clientY,t:performance.now(),moved:false});
  st.style.left=(e.clientX-r.left)+'px';st.style.top=(e.clientY-r.top)+'px';kn.style.transform='';st.classList.add('on');try{W.setPointerCapture(e.pointerId)}catch(_){}});
 W.addEventListener('pointermove',e=>{if(e.pointerId!==STK.id)return;const dx=e.clientX-STK.x,dy=e.clientY-STK.y,d=Math.hypot(dx,dy),k=Math.min(1,STK.R/(d||1));
  kn.style.transform=`translate(${dx*k}px,${dy*k}px)`;if(d<STK.DEAD){if(TW&&!STK.moved)TW.dir=null;return}

 const end=e=>{if(e.pointerId!==STK.id)return;const tap=!STK.moved&&performance.now()-STK.t<500,x=STK.x,y=STK.y;releaseDpad();
  if(tap&&e.type==='pointerup')townTap({clientX:x,clientY:y,preventDefault(){}})};
 W.addEventListener('pointerup',end);W.addEventListener('pointercancel',end)})();

let BT=null;
/* 敵のイラスト（img/foe/ID.webp）。ない敵は下の図形で描く。変身後は ID2.webp */

/* ===== ギアフォックスの加入ミッション：三面図を順番に3問（各1問・まちがえたら説明つきで同じ段をやり直し） =====
   CADQ_STEPS を書きかえると、段の数・大きさ・セリフを変えられる。w,d＝横・奥行きのマス数、h＝最大の高さ
   段の大きさ。セリフは CADQ_MISSION にある */
const CADQ_STEPS=[
 {w:2,d:2,h:2,say:'まずは小さい部品。三面図は、上・前・右から見た形だよ。3つを頭の中で組み立てて、正しい立体を選んで！'},
 {w:3,d:2,h:3,say:'次はモーターの台座。段差がどこにあるか、正面図と右側面図の線をよく見比べて！'},
 {w:3,d:3,h:3,say:'最後は歯車箱のふた。左右が反対の「鏡の形」にだまされないでね。立体を回して、三面図と見くらべて！'}];
const CADQ_N=2;  /* 選択肢の数 */
const CADQ=(()=>{const rnd=n=>Math.floor(Math.random()*n),C30=Math.cos(Math.PI/6);
 function connected(hm){const d=hm.length,w=hm[0].length,seen=new Set();let st=null;for(let y=0;y<d;y++)for(let x=0;x<w;x++)if(hm[y][x]&&!st)st=[x,y];if(!st)return false;
  const q=[st];seen.add(st+'');while(q.length){const[x,y]=q.pop();[[1,0],[-1,0],[0,1],[0,-1]].forEach(([a,b])=>{const nx=x+a,ny=y+b;if(nx<0||ny<0||nx>=w||ny>=d||!hm[ny][nx]||seen.has(nx+','+ny))return;seen.add(nx+','+ny);q.push([nx,ny])})}
  return seen.size===hm.flat().filter(v=>v).length}
 function genShape(L){for(;;){const hm=[];for(let y=0;y<L.d;y++){hm.push([]);for(let x=0;x<L.w;x++)hm[y].push(rnd(L.h+1))}
  const c=hm.flat(),n=c.filter(v=>v>0).length;if(n<Math.max(2,L.w*L.d-2)||!connected(hm)||Math.max(...c)<2)continue;return hm}}
 function views(hm){const d=hm.length,w=hm[0].length,H=Math.max(...hm.flat()),front=[],top=[],side=[];
  for(let z=0;z<H;z++){front.push([]);for(let x=0;x<w;x++){let v=-1;for(let y=0;y<d;y++)if(hm[y][x]>z){v=y;break}front[z].push(v)}}
  for(let y=0;y<d;y++){top.push([]);for(let x=0;x<w;x++)top[y].push(hm[y][x]?H-hm[y][x]:-1)}
  for(let z=0;z<H;z++){side.push([]);for(let y=0;y<d;y++){let v=-1;for(let x=w-1;x>=0;x--)if(hm[y][x]>z){v=w-1-x;break}side[z].push(v)}}

function sv(u,k){const isM=!!CHARS[u.id];let v=isM?stat(u,k):u[k];const st=isM?BT.st[u.id]:u.st;
 if((k==='atk'||k==='mag')&&st.atk)v*=1+st.atk.v;if(k==='def'&&st.def)v*=1+st.def.v;if(k==='def'&&st.defdown)v*=1-st.defdown.v;

async function hit(a,d,s,critForce){const r=dmgCalc(a,d,s,critForce);d.hp-=r.v;const isM=!!CHARS[d.id];
 if(isM){d.sp=Math.min(SP_MAX,d.sp+8);const el=memEl(d);if(el){el.classList.remove('hit');void el.offsetWidth;el.classList.add('hit')}$('flash').classList.add('on');setTimeout(()=>$('flash').classList.remove('on'),110)}
 else{const el=foeEl(d);if(el){el.classList.add('hit');setTimeout(()=>el.classList.remove('hit'),120)}}
 if(CHARS[a.id])a.sp=Math.min(SP_MAX,a.sp+6);
 tone(r.crit?880:220,.12,r.crit?'triangle':'sawtooth',.1,r.crit?1320:80);
 renderB();popOn(isM?memEl(d):foeEl(d),r.v,r.crit?'c':'');await logL(`${nameOf(d)}に ${r.v} のダメージ${r.crit?'（会心！）':''}`,450);
 if(d.hp<=0){d.hp=0;renderB();await logL(`${nameOf(d)}は${isM?'たおれた…':'たおれた！'}`,450)}}
const nameOf=u=>CHARS[u.id]?CHARS[u.id].name:u.name;

async function execTurn(){clearTg();menuIdle();const my=BT;  /* my：途中で別の戦闘に変わっていたら、この戦闘の処理はやめる */
 BT.cmds.forEach(c=>{if(c.k==='guard')BT.st[c.who.id].guard={v:1,t:1}});
 const acts=BT.cmds.map(c=>({...c,spd:sv(c.who,'spd')*rnd(.9,1.1)}));
 alive(BT.foes).forEach(f=>acts.push({foe:f,spd:f.spd*rnd(.9,1.1)}));acts.sort((a,b)=>b.spd-a.spd);
 for(const a of acts){if(BT!==my)return;if(!alive(BT.foes).length||!alive(G.party).length)break;

async function memAct(c){const m=c.who,nm=CHARS[m.id].name,st=BT.st[m.id];

 if(c.k==='guard'){await logL(`${nm}は身を守っている`,400);return}
 if(c.k==='item'){const it=ITEMS[c.it];if(G.items[c.it]<=0){await logL('どうぐがなかった…');return}const t=c.t&&c.t.hp>0?c.t:m;
  /* 満タンなら使わない（数を減らさない） */
  if((!it.hp||t.hp>=maxHp(t))&&(!it.mp||t.mp>=maxMp(t))){await logL(`${CHARS[t.id].name}は${it.hp?'HP':'MP'}が満タンなので、${it.n}を使わなかった`,500);return}
  G.items[c.it]--;await logL(`${nm}は${it.n}を使った`,400);if(it.hp)await heal(t,it.hp);if(it.mp){t.mp=Math.min(maxMp(t),t.mp+it.mp);renderB();await logL(`${CHARS[t.id].name}のMPが回復`,400)}return}
 if(c.k==='atk'){const t=c.t&&c.t.hp>0?c.t:alive(BT.foes)[0];await logL(`${nm}の攻撃！`,350);await hit(m,t,{kind:'phys',pw:1});return}
 if(c.k==='sp'){await doSpecial(m,c.t);return}
 const s=SKILLS[c.sk],mc=cost(m,c.sk);if(m.mp<mc){await logL(`${nm}はMPが足りない！`);return}m.mp-=mc;renderB();await logL(`${nm}の${s.n}！`,450);
 if(s.kind==='phys'||s.kind==='mag'){const ts=s.tg==='all'?alive(BT.foes):[c.t&&c.t.hp>0?c.t:alive(BT.foes)[0]];

 else if(s.kind==='heal'){if(s.fx==='revive'){const t=c.t&&c.t.hp<=0?c.t:G.party.find(x=>x.hp<=0);if(t){t.hp=Math.round(maxHp(t)/2);renderB();await logL(`${CHARS[t.id].name}が復活した！`)}else await logL('しかし何も起こらなかった')}

 else if(s.kind==='buff'){const ts=s.tg==='allies'?alive(G.party):s.tg==='self'?[m]:[c.t&&c.t.hp>0?c.t:m];ts.forEach(t=>addSt(t,s.fx,s.v||1,longT(m,s.t)));renderB();
  await logL(s.fx==='taunt'?`${nm}は敵を引きつけている！`:s.fx==='def'?'防御が上がった！':'攻撃と魔力が上がった！',450)}
 else if(s.kind==='debuff'){const t=c.t&&c.t.hp>0?c.t:alive(BT.foes)[0];addSt(t,s.fx,s.v,longT(m,s.t));renderB();await logL(`${t.name}の防御が下がった！（弱点が見えた）`,450)}}
async function foeAct(f){if(f.st.stun){delete f.st.stun;await logL(`${f.name}はしびれて動けない！`);return}
 let sk;if(typeof f.ai==='string'){sk=(BOSS_AI[f.ai]||BOSS_AI.boss)(f)}
 else{let r=Math.random();for(const[k,w]of f.ai){r-=w;if(r<=0){sk=k;break}}sk=sk||f.ai[0][0]}
 const s=SKILLS[sk]||SKILLS.e_atk;
 /* ため（予告）：攻撃しない。次の行動は BOSS_AI が f.charge の技を必ず出す */
 if(s.kind==='charge'){if(!f.charge)f.charge='e_smash';renderB();await logL(`${f.name}${s.msg||'は力をためている…！（次のターンに大技）'}`,900);return}
 /* 変身：攻撃しない。自分の防御ダウン・しびれを消す */
 if(s.kind==='phase'){await logL(`${f.name}${s.msg||'の姿が変わった！'}`,1300);delete f.st.defdown;delete f.st.stun;f.col='#a0203a';f.awake=true;f.name=f.name.replace(/・覚醒$/,'')+'・覚醒';renderB();
  const el=foeEl(f);if(el){el.classList.add('hit');setTimeout(()=>el.classList.remove('hit'),300)}buzz();
  if(G.flags.selfRust){const h=G.party.find(m=>m.id===G.hero&&m.hp>0);if(h)await logL(`${CHARS[h.id].name}「${CHARS[h.id].lines[0]}」`,1300)}return}
 /* 自分を強化 */
 if(s.kind==='buff'&&s.tg==='self'){addSt(f,s.fx,s.v,s.t);renderB();await logL(`${f.name}の${s.n}！ ${f.name}${s.msg||'の力が上がった！'}`,650);return}
 await logL(`${f.name}の${s.n}！`,400);
 const al=alive(G.party);const taunter=al.find(m=>BT.st[m.id].taunt);
 const ts=s.tg==='all'?al:[taunter||pick(al)];
 for(const t of ts){if(t.hp<=0)continue;await hit(f,t,s);
  if(t.hp>0&&s.fx==='defdown'){addSt(t,'defdown',s.v,s.t);renderB()}
  if(t.hp>0&&s.fx==='stun'&&Math.random()<s.v){addSt(t,'stun',1,2);renderB();await logL(`${CHARS[t.id].name}はしびれた！`,400)}}}
/* ---- 必殺技（魔法陣なぞり） ---- */
async function doSpecial(m,tg){const c=CHARS[m.id];await logL(`${c.name}の必殺技！`,300);m.sp=0;
 show('craft');$('craftT').textContent=`${c.name}「${c.sp.n}」`;$('craftSub').textContent='魔法陣をなぞれ！';
 const r=await runDesign({type:c.sp.shape,tier:1,color:'#e8c35a',label:'必殺',seg:2.4,w:.15});  /* 必殺の線の太さは難易度を変えないため元のまま */const s=r.reach*r.acc;
 show('battle');renderB();await say(`${c.sp.n}！<br>なぞり <span class="big">${Math.round(s*100)}%</span>`,1100);
 /* 狙う敵：選んだ敵（たおれていたら、HPがいちばん多い敵） */
 if(m.id==='wolf'){const t=tg&&tg.hp>0&&BT.foes.includes(tg)?tg:alive(BT.foes).sort((a,b)=>b.hp-a.hp)[0];if(t)await hit(m,t,{kind:'phys',pw:2.2+2.8*s},s>=.95)}
 else if(m.id==='dodo'){alive(G.party).forEach(t=>addSt(t,'def',.4+.6*s,3));addSt(m,'taunt',1,3);await heal(m,maxHp(m)*(.2+.5*s));await logL('味方全員の防御が大きく上がった！',400)}
 else if(m.id==='fox'){if(s>=.6)for(const t of G.party.filter(x=>x.hp<=0)){t.hp=1;await logL(`${CHARS[t.id].name}が復活した！`,350)}for(const t of alive(G.party))await heal(t,maxHp(t)*(.3+.5*s))}
 else if(m.id==='owl'){for(const t of alive(BT.foes))await hit(m,t,{kind:'mag',pw:1+1.6*s})}}
/* ---- 勝敗 ---- */
async function winB(){inBattle=false;tone(523,.3,'triangle',.12);setTimeout(()=>tone(784,.4,'triangle',.12),150);
 const exp=BT.foes.reduce((a,f)=>a+f.exp,0);let mat=0,itm='';BT.foes.forEach(f=>{if(Math.random()<f.mat)mat++});if(Math.random()<.3){G.items.oil++;itm='、オイル×1'}
 G.mat+=mat;let unEq=0;const lines=[`経験値 ${exp}　${SCRAP()}鉄くず×${mat}${itm}`];
 for(const m of G.party){if(m.lv>=LV_CAP){m.exp=0;continue}const g=m.hp>0?exp:Math.floor(exp/2);m.exp+=g;
  while(m.lv<LV_CAP&&m.exp>=EXP_NEXT(m.lv)){m.exp-=EXP_NEXT(m.lv);const hpB=maxHp(m),mpB=maxMp(m);const got=levelUp(m);m.hp+=maxHp(m)-hpB;m.mp+=maxMp(m)-mpB;
   lines.push(`${IC('levelup',20)} ${CHARS[m.id].name}は Lv${m.lv} になった！${m.lv>=LV_CAP?'（レベル最大）':''}`);got.forEach(sk=>{const eq=m.skills.includes(sk);if(!eq)unEq++;lines.push(`　→「${SKILLS[sk].n}」をおぼえた！<span class="nw">${eq?'（自動で装備した）':'（まだ装備していない）'}</span>`)})}
  if(m.lv>=LV_CAP)m.exp=0}
 if(unEq)lines.push(`\n${IC('newskill',20)} わざは4つまで。新しい技は自動では装備されません。\n　地図・町の「パーティ」で入れかえよう（NEW の印）。`);
 G.party.forEach(m=>{if(m.hp<=0)m.hp=1});
 /* 初めて勝った（章ボスは第1章クリア前なら何度でも「初めて」）。勝利の会話を読み終えるまで pendWin に残す */
 const boss=BT.boss,node=BT.node,first=!!node&&(!G.cleared.includes(node.id)||(node.id===AREAS.under.boss&&!G.flags.ch1));clear(node);
 if(boss&&first&&node)G.flags.pendWin=node.id;save();
 $('resP').innerHTML=`<h2 style="margin:0 0 6px;color:var(--gold)">勝利！</h2><div class="note" style="font-size:15px;white-space:pre-wrap">${lines.join('\n')}</div>`;$('resBtns').innerHTML='';
 addBtn('地図にもどる',()=>afterWin(boss,node,first),'gold');show('result')}
/* ボスに初めて勝ったあと：勝利会話 → 次のエリアの解放（章ボスならエンディング）。終わったら pendWin を消す */
let afterWinBusy=false;
async function afterWin(boss,node,first){if(!(boss&&first&&node)){openMap();return}if(afterWinBusy)return;afterWinBusy=true;try{
 await talk(BOSS_WIN[node.talk]||[]);
 if(node.id===AREAS.under.boss){await talk(ENDING,'ev_ending1');G.flags.ch1=1;delete G.flags.pendWin;G.town={x:TOWN_START[0],y:TOWN_START[1]};G.where={s:'town'};G.party.forEach(m=>{m.hp=maxHp(m);m.mp=maxMp(m)});save();showEnding();return}
 delete G.flags.pendWin;save();
 const nx=AREA_ORDER.find(k=>AREAS[k].need===node.id);if(nx){sfx.win();await say(`${IC('unlock',30)} 「${AREAS[nx].n}」が解放された！<br><span style="font-size:14px">町の門から行ける（推奨Lv ${AREAS[nx].lv}）</span>`,1900)}
 openMap()}finally{afterWinBusy=false}}
function showEnding(){sfx.win();const h=CHARS[G.hero];
 $('resP').innerHTML=`<div style="text-align:center"><img class="endImg" src="img/ev/ev_ending1.webp" alt=""><h2 style="margin:4px 0;color:var(--gold)">第1章 クリア！</h2><div style="font-weight:800">「夜の工房に灯る」</div>
  <div style="display:flex;justify-content:center;gap:4px;margin:10px 0">${G.party.map(m=>`<img src="${CHARS[m.id].img}" style="width:64px;height:64px;object-fit:contain" alt="">`).join('')}</div>
  <div class="note">${h.name}と仲間たち　${G.party.map(m=>CHARS[m.id].name+' Lv'+m.lv).join('・')}<br>クリア後も、町と各エリアで遊べます（レベル上げ・武器づくり・ボスの再戦）。<br>第2章「停電の街」へつづく</div></div>`;
 $('resBtns').innerHTML='';addBtn('町にもどる',openTown,'gold');show('result')}
async function loseB(){inBattle=false;G.party.forEach(m=>{m.hp=maxHp(m);m.mp=maxMp(m)});G.town={x:TOWN_START[0],y:TOWN_START[1]};G.where={s:'town'};save();
 $('resP').innerHTML=`<h2 style="margin:0 0 6px">力尽きた……</h2><div class="note" style="font-size:15px;white-space:pre-wrap">気がつくと、町の古い工房の扉の前にいた。\n全員のHPとMPは回復している。\nレベルと経験値はそのまま。もう一度挑もう。</div>`;$('resBtns').innerHTML='';addBtn('町にもどる',openTown,'gold');show('result')}

try{G=migrate(G)}catch(e){console.warn('save migrate failed',e);G=null}

if(G&&OPT.fast===undefined&&G.flags.fast){OPT.fast=true;saveOpt()}  /* 前の版は速さを G.flags.fast に保存していた */
if(G)G.flags.fast=!!OPT.fast;
$('btnStart').textContent=G?'つづきから':'はじめる';$('btnReset').style.display=G?'':'none';
$('tVer').textContent=`β版 ver ${VERSION}`;$('tNote').textContent=loadNote;
